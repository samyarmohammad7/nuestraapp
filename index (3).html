/* =====================================================================
   FRASCO DE RAZONES
   ===================================================================== */
function mountRazones() {
  renderTop('Frasco de razones');
  view.innerHTML = `<div class="jar" id="jar"></div><div class="card" id="rmias"></div>`;
  let raz = {}, shown = null;
  const seenKey = 'nuestra:razones:' + me;
  const seen = () => { try { return new Set(JSON.parse(lsGet(seenKey) || '[]')); } catch { return new Set(); } };
  const draw = () => {
    const all = listOf(raz), paraMi = all.filter(r => r.de === them), mias = all.filter(r => r.de === me).sort((a, b) => b.t - a.t);
    const s = seen(), nuevas = paraMi.filter(r => !s.has(r.id)).length;
    $('#jar').innerHTML = `<span class="j" id="jj">🫙</span><b>${paraMi.length} ${paraMi.length === 1 ? 'razón' : 'razones'}</b><p class="muted" style="margin:2px 0 10px;font-size:13.5px">por las que ${esc(pname(them))} te ama${nuevas ? ` · <span style="color:#ffd36b">${nuevas} sin leer</span>` : ''}</p>
      <button class="btn" id="jsac" ${paraMi.length ? '' : 'disabled'}>✨ Sacar una razón</button>
      ${shown ? `<div class="razon">${esc(shown.texto)}<small style="display:block;font:700 12px var(--fb);color:#9b7f8f;margin-top:6px">${fdate(shown.t, { day: 'numeric', month: 'long', year: 'numeric' })}</small></div>` : paraMi.length ? '' : `<p class="muted" style="font-size:13px;margin:10px 0 0">Cuando ${esc(pname(them))} escriba razones, aquí las vas a poder sacar una por una.</p>`}`;
    $('#jsac').onclick = () => {

async function unzipTxt(file) {

  }

  const start = f.lho + 30 + dv.getUint16(f.lho + 26, true) + dv.getUint16(f.lho + 28, true), data = buf.subarray(start, start + f.size);
  if (f.method === 0) return new TextDecoder().decode(data);

const TEAMO_RE = /(^|[^a-záéíóúüñ])(te\s*a+m+o+|i\s+love\s+you+)(?=$|[^a-záéíóúüñ])/giu;

    if (m) msgs.push({ a: +m[1], b: +m[2], c: +m[3], y4: m[1].length === 4, h: +m[4], mi: +m[5], se: +(m[6] || 0), ap: (m[7] || '').toLowerCase(), who: m[8].trim(), tx: m[9] });

  }

    if (y < 100) y += 2000;

    const t = new Date(y, mo - 1, d, h, x.mi, x.se).getTime(); x.t = t;

    const ke = (x.tx.match(TEX_RE) || []).length;

}

function narrate(el, text, wag) {
  if (!el) return;
  el.innerHTML = `<img src="img/gia.jpg" alt="Gia" class="${wag ? 'wag' : ''}"><div class="b ${el.dataset.last !== text ? 'new' : ''}">${text}</div>`;
  el.dataset.last = text;
}
function oppHTML(n, extra = '', turn = false) {
  const t = presence[them] || {};
  return `<div class="opp ${turn ? 'turn' : ''}"><div><div class="nm"><i></i>${esc(pname(them))} ${extra}</div><div class="sub">${t.on ? (t.at === current?.id ? '🟢 Aquí contigo' : '🟢 En línea') : 'Sin conexión'} · ${sky(localHour(them))} ${localTime(them)}</div></div>
    <div class="fan">${backs(n)}<span class="count">${n}</span></div></div>`;
}
function evWatcher(cb) { let seen = null; return st => { const e = st?.ev; if (!e) return; if (seen === null) { seen = e.id; return; } if (e.id === seen) return; seen = e.id; cb(e); }; }

/* =====================================================================
   UNO
   ===================================================================== */
function mountUno() {
  renderTop('UNO', `<button class="ib" id="menu" aria-label="Opciones">⋯</button>`);
  view.innerHTML = `<div id="g"></div>${reactBar()}`;
  const g = $('#g'), narrBox = { last: '' };
  let st = null, prevTurn = null, prevTop = null, prevN = null, prevHand = new Set(), firstRender = true, narrMsg = '', lastNarr = '';
  const path = 'cartas/uno';
  const act = fn => store.tx(path, cur => fn(cur) ?? undefined).then(r => {
    if (!r.committed) { toast('Esa jugada no se puede hacer'); return; }
    if (r.value?.winner) recordWin('uno', r.value);
  });
  const onEv = evWatcher(e => {
    if (e.kind === 'uno') { popup('¡UNO!', pname(e.by)); sfx.pop(); narrMsg = e.by === me ? '¡Dijiste UNO! Ya casi 🐾' : `¡${esc(pname(e.by))} dijo UNO! 😱 Cuidado`; }
    else if (e.kind === 'catch') { popup('¡Te pillé!', fmtTxt(e.text)); sfx.pop(); narrMsg = `¡Guau! ${fmt(e.text)} 🙈`; }
    else if (e.kind === 'win') {
      if (e.by === me) { confetti(); sfx.win(); popup('¡Ganaste!', e.text); } else { rain(16, ['💜', '💗', '🐾']); sfx.sad(); popup(`Ganó ${pname(e.by)}`, e.text); }
    }
  });
  const unsub = store.on(path, v => {
    if (!v) { store.tx(path, c => c ? undefined : R.unoNewRound(null, P, P[Math.floor(Math.random() * 2)])); return; }
    st = v; onEv(st);
    if (st.turn === me && prevTurn !== me && prevTurn !== null && !st.winner) { sfx.turn(); navigator.vibrate?.(60); }
    prevTurn = st.turn;
    render();
  });
  $('#menu').onclick = () => {
    const s = sheet(`<h3>UNO</h3>
      <h4>Reglas</h4><ul>
      <li>Juega una carta del mismo color, número o símbolo, o un comodín.</li>
      <li>Si no puedes, toca el mazo para robar una. Si la que robas sirve, puedes jugarla al momento.</li>
      <li><b>Salta</b> y <b>Reversa</b>: entre dos, vuelves a jugar. <b>+2</b> y <b>+4</b>: el otro roba y pierde el turno.</li>
      <li>El <b>+4</b> solo se puede jugar si no tienes ninguna carta del color en juego.</li>
      <li>Toca <b>¡UNO!</b> antes de quedarte con una carta. Si no lo dices y te pillan, robas 2.</li>
      <li>Quien se queda sin cartas suma los puntos del otro: números por su valor, acciones 20, comodines 50. Primero a 500 gana la partida.</li></ul>
      <div class="row"><button class="btn ghost" data-new>Empezar partida nueva</button><button class="btn" data-close>Cerrar</button></div>`);
    $('[data-new]', s).onclick = () => { if (confirm('¿Empezar una partida nueva? Se pierde la actual.')) { store.set(path, R.unoNewRound({ wins: st?.wins }, P, P[Math.floor(Math.random() * 2)])); s.remove(); } };
  };
  function chooseColor(id) {
    const s = sheet(`<h3>🎨 Elige el color</h3><div class="colors">${R.UNO_COLORS.map(c => `<button class="c-${c}" data-c="${c}">${R.UNO_COLOR_NAMES[c]}</button>`).join('')}</div><div class="row"><button class="btn ghost sm" data-close>Cancelar</button></div>`);
    $$('[data-c]', s).forEach(b => b.onclick = () => { s.remove(); act(cur => R.unoPlay(cur, P, me, id, b.dataset.c)); });
  }
  function render() {
    if (!st) return;
    const hand = R.L(st.hands?.[me]), oh = R.L(st.hands?.[them]);
    const topC = R.L(st.disc).at(-1), myTurn = st.turn === me && !st.winner;
    const playable = c => myTurn && (!st.drawn || c === st.drawn) && R.unoCanPlay(st, c, hand);
    const unoOn = (myTurn && hand.length === 2 && !st.uno?.[me] && hand.some(playable)) || st.catch === me;
    const catchOn = st.catch === them && oh.length === 1;
    const oppBadge = oh.length === 1 && st.uno?.[them] ? '<span class="badge">¡UNO!</span>' : '';
    const newRound = st.n !== prevN;
    const topAnim = !firstRender && topC !== prevTop && !newRound ? (prevHand.has(topC) ? 'in-b' : 'in-t') : '';
    if (topAnim) sfx.card();
    const fresh = new Set(hand.filter(c => !prevHand.has(c)));
    const dealAll = newRound || firstRender;
    g.innerHTML = `
      ${oppHTML(oh.length, oppBadge, st.turn === them && !st.winner)}
      ${retoBar('uno')}
      <div class="board ${st.winner ? 'won' : ''}">
        <button class="pile ${myTurn && !st.drawn ? 'can' : ''}" id="draw" ${myTurn && !st.drawn ? '' : 'disabled'} aria-label="Robar carta"><div class="cback big"></div>Robar · ${R.L(st.deck).length}</button>
        <div>${topC ? unoCard(topC, topAnim) : ''}</div>
        <span class="colorring c-${st.color}">${R.UNO_COLOR_NAMES[st.color] || ''}</span>
        ${st.winner ? `<div class="over"><div style="font-size:50px">${st.winner === me ? '🏆' : '💜'}</div><h2>${st.matchWinner ? (st.matchWinner === me ? '¡Ganaste la partida!' : `${esc(pname(st.matchWinner))} ganó la partida`) : (st.winner === me ? '¡Ganaste la ronda!' : `Ganó ${esc(pname(st.winner))}`)}</h2>
          <p class="muted" style="margin:0">${fmt(st.log)}</p>${prizeLine('uno', st.winner)}<button class="btn" id="next">${st.matchWinner ? 'Nueva partida' : 'Siguiente ronda'}</button></div>` : ''}
      </div>
      <div class="narr" id="narr"></div>
      <div class="status ${myTurn ? 'mine' : ''}">${st.winner ? '' : myTurn ? (st.drawn ? 'Robaste una que sirve: juégala o pasa' : `✨ Tu turno, ${esc(pname(me))}`) : `Turno de ${esc(pname(them))}`}</div>
      <div class="row">
        ${unoOn ? '<button class="btn uno" id="uno">¡UNO!</button>' : ''}
        ${catchOn ? `<button class="btn catch" id="catch">¡${esc(pname(them))} no dijo UNO!</button>` : ''}
        ${myTurn && st.drawn ? '<button class="btn ghost" id="pass">Pasar</button>' : ''}
      </div>
      <div class="hand ${myTurn ? 'myturn' : ''}">${hand.map((c, i) => unoCard(c, (myTurn ? (playable(c) ? 'ok' : 'no') : '') + (dealAll ? ' deal' : fresh.has(c) ? ' in-t' : ''), dealAll ? `animation-delay:${i * 70}ms` : '')).join('')}</div>
      <div class="scorebar"><span><span class="dot" style="--c:${pcol(me)}"></span>${esc(pname(me))} <b>${st.pts?.[me] || 0}</b></span><span class="muted">a ${R.UNO_TARGET} · partidas ${st.wins?.[me] || 0}-${st.wins?.[them] || 0}</span><span><b>${st.pts?.[them] || 0}</b> ${esc(pname(them))}<span class="dot" style="--c:${pcol(them)};margin:0 0 0 5px"></span></span></div>`;
    const def = st.winner ? `${fmt(st.log)} 🏆` : myTurn ? `${fmt(st.log)}. Te toca, ${esc(pname(me))} 🐾` : fmt(st.log);
    const text = narrMsg || def;
    const nEl = $('#narr', g); nEl.dataset.last = lastNarr; narrate(nEl, text, !!narrMsg); lastNarr = text; narrMsg = '';
    $$('.hand .uc.ok', g).forEach(el => el.onclick = () => { const id = el.dataset.id; if (R.isWild(id)) chooseColor(id); else act(cur => R.unoPlay(cur, P, me, id)); });
    $$('.hand .uc.no', g).forEach(el => el.onclick = () => toast(st.drawn ? 'Solo puedes jugar la carta que robaste' : 'Esa carta no combina'));
    $('#draw', g)?.addEventListener('click', () => { sfx.card(); act(cur => R.unoDraw(cur, P, me)); });
    $('#pass', g)?.addEventListener('click', () => act(cur => R.unoPass(cur, P, me)));
    $('#uno', g)?.addEventListener('click', () => act(cur => R.unoSayUno(cur, P, me)));
    $('#catch', g)?.addEventListener('click', () => act(cur => R.unoCatch(cur, P, me)));
    $('#next', g)?.addEventListener('click', () => store.tx(path, cur => cur && cur.winner ? R.unoNewRound(cur, P, other(cur.dealer)) : undefined));
    $('[data-reto]', g)?.addEventListener('click', () => openRetos('uno'));
    prevTop = topC; prevN = st.n; prevHand = new Set(hand); firstRender = false;
  }
  current = { id: 'uno', onPresence: render, onGames: render, cleanup() { unsub(); } };
}

/* =====================================================================
   CUARENTA
   ===================================================================== */
function mountC40() {
  renderTop('Cuarenta', `<button class="ib" id="menu" aria-label="Reglas">ⓘ</button>`);
  view.innerHTML = `<div id="g"></div>${reactBar()}`;
  const g = $('#g');
  let st = null, sel = null, prevTurn = null, prevTable = null, prevHand = new Set(), prevKey = null, firstRender = true, narrMsg = '', lastNarr = '', shake = false, renderT = null, wonShown = null;
  const path = 'cartas/cuarenta';
  const act = fn => store.tx(path, cur => fn(cur) ?? undefined).then(r => {
    if (!r.committed) { toast('Esa jugada no se puede hacer'); return; }
    if (r.value?.winner) recordWin('cuarenta', r.value);
  });
  const onEv = evWatcher(e => {
    if (e.kind === 'caida' || e.kind === 'limpia' || e.kind === 'ronda') {
      popup(e.text.replace(/ \+\d+$/, ''), `${pname(e.by)}${e.pts ? ` +${e.pts}` : ''}`); sfx.pop(); navigator.vibrate?.(40);
      if (e.kind === 'caida') { shake = true; narrMsg = `¡Guau! ¡Caída de ${esc(pname(e.by))}! 🐾`; }
      else if (e.kind === 'limpia') narrMsg = e.by === me ? '¡Mesa limpia! Te lo llevaste todo ✨' : `¡Mesa limpia! ${esc(pname(e.by))} se lo llevó todo ✨`;
      else narrMsg = `¡${esc(e.text)} para ${esc(pname(e.by))}!`;
    } else if (e.kind === 'carton') { toast(fmtTxt(e.text), 6500); narrMsg = `Contamos el cartón: ${fmt(e.text.replace(/^Cartón: /, ''))}`; }
  });
  const unsub = store.on(path, v => {
    if (!v) { store.tx(path, c => c ? undefined : R.c40NewChica(null, P, P[Math.floor(Math.random() * 2)])); return; }
    if (st && (v.n !== st.n || v.mano !== st.mano || v.turn !== me)) sel = null;
    const oldSt = st;
    st = v; onEv(st);
    if (st.turn === me && prevTurn !== me && prevTurn !== null && !st.winner) { sfx.turn(); navigator.vibrate?.(60); }
    prevTurn = st.turn;
    // Las cartas que se llevan salen volando hacia quien las ganó, y luego se redibuja
    const newTable = new Set(R.L(st.table));
    const gone = oldSt && oldSt.n === st.n ? R.L(oldSt.table).filter(c => !newTable.has(c)) : [];
    clearTimeout(renderT);
    if (gone.length && !firstRender) {
      const mineTook = oldSt.turn === me;
      gone.forEach(c => $(`.mesa .pc[data-id="${c}"]`, g)?.classList.add(mineTook ? 'out-b' : 'out-t'));
      $('.myhand', g)?.classList.remove('myturn'); $('#opts', g)?.replaceChildren(); g.style.pointerEvents = 'none';
      sfx.card();
      renderT = setTimeout(() => { renderT = null; g.style.pointerEvents = ''; render(); }, 430);
    } else render();
  });
  $('#menu').onclick = () => {
    const rl = { ...R.DEFAULT_RULES, ...(st?.rules || {}) };
    const s = sheet(`<h3>Reglas del Cuarenta</h3>
      <ul>
      <li>Baraja de 40: A, 2 a 7, J, Q y K. Orden: A 2 3 4 5 6 7 J Q K.</li>
      <li>5 cartas a cada uno, 4 veces por mazo. Empieza quien no reparte.</li>
      <li><b>Llevar:</b> con la misma carta o, con números, sumando cartas de la mesa (3 y 4 con un 7). Las figuras no suman.</li>
      <li><b>Escalera:</b> después de llevar, te llevas las siguientes en orden si están en la mesa.</li>
      <li><b>Caída (+2):</b> llevas con pareja la carta que el otro acaba de tirar.</li>
      <li><b>Limpia (+2):</b> dejas la mesa vacía.</li>
      <li><b>Ronda (+2):</b> te reparten tres iguales. Cuatro iguales ganan la chica.</li>
      <li><b>Cartón:</b> 20 cartas = 6 puntos, y 1 más por cada extra, redondeando al par.</li>
      <li><b>En 38</b> solo se sale con caída.</li></ul>
      <h4>Variantes</h4>
      <label class="tog"><input type="checkbox" data-r="caidaLimpia4" ${rl.caidaLimpia4 ? 'checked' : ''}> Caída y limpia juntas suman 4 (si no, solo 2)</label>
      <label class="tog"><input type="checkbox" data-r="carton30" ${rl.carton30 ? 'checked' : ''}> Con 30 o más, el cartón ya no suma</label>
      <label class="tog"><input type="checkbox" data-r="empateDealer" ${rl.empateDealer ? 'checked' : ''}> En empate de cartón, 2 puntos para quien reparte (si no, para el otro)</label>
      <div class="row"><button class="btn ghost" data-new>Empezar chica nueva</button><button class="btn" data-close>Cerrar</button></div>`);
    $$('[data-r]', s).forEach(i => i.onchange = () => store.tx(path, cur => cur ? { ...cur, rules: { ...R.DEFAULT_RULES, ...(cur.rules || {}), [i.dataset.r]: i.checked } } : undefined));
    $('[data-new]', s).onclick = () => { if (confirm('¿Empezar una chica nueva? Se pierde la actual.')) { store.set(path, R.c40NewChica(st, P, other(st?.dealer || P[0]))); s.remove(); } };
  };
  const optLabel = o => `${o.kind === 'par' ? 'Llevar' : 'Sumar'} ${o.take.map(R.cname).join(' + ')}${o.ladder.length ? ` y escalera ${o.ladder.map(R.cname).join(' ')}` : ''}`;
  function render() {
    if (!st) return;
    const hand = R.L(st.hands?.[me]), oh = R.L(st.hands?.[them]), table = R.L(st.table);
    const myTurn = st.turn === me && !st.winner;
    const opts = sel && myTurn ? R.c40Options(st.table, sel) : [];
    const hl = new Set(opts[0]?.all || []);
    const sc = p => st.score?.[p] || 0;
    const key = `${st.n}:${st.mano}`, newDeal = key !== prevKey;
    const prevT = new Set(prevTable || []);
    const tableAnim = c => firstRender || prevTable === null || prevT.has(c) ? '' : (prevHand.has(c) ? 'in-b' : 'in-t');
    if (!firstRender && table.some(c => !prevT.has(c))) sfx.card();
    const ptsBox = p => `<div><div class="n"><span><span style="color:${pcol(p)}">●</span> ${esc(pname(p))}</span><b>${sc(p)}</b></div><div class="bar"><i style="width:${sc(p) / 40 * 100}%;background:linear-gradient(90deg,${pcol(p)},#ffd36b)"></i></div><div class="sub">Cartón ${st.carton?.[p] || 0} · Chicas ${st.chicas?.[p] || 0}${sc(p) === 38 ? ' · <b style="color:var(--pink)">¡en 38!</b>' : ''}</div></div>`;
    g.innerHTML = `
      ${oppHTML(oh.length, '', st.turn === them && !st.winner)}
      ${retoBar('cuarenta')}
      <div class="info"><span>Mano ${st.mano || 1} de 4</span><span>Mazo ${R.L(st.deck).length}</span><span>Reparte ${esc(pname(st.dealer))}</span></div>
      <div class="mesa ${shake ? 'shake' : ''} ${st.winner ? 'won' : ''}">
        ${table.length ? table.map(c => pCard(c, [hl.has(c) ? 'hl' : '', st.last && st.last.card === c ? 'lastc' : '', tableAnim(c)].join(' '))).join('') : '<span class="empty">Mesa limpia ✨</span>'}
        ${st.winner ? `<div class="over"><div style="font-size:50px">${st.winner === me ? '🏆' : '💜'}</div><h2>${st.winner === me ? '¡Ganaste la chica!' : `${esc(pname(st.winner))} ganó la chica`}</h2><p class="muted" style="margin:0">Chicas: ${esc(pname(me))} ${st.chicas?.[me] || 0} · ${esc(pname(them))} ${st.chicas?.[them] || 0}</p>${prizeLine('cuarenta', st.winner)}<button class="btn" id="next">Nueva chica</button></div>` : ''}
      </div>
      <div class="narr" id="narr"></div>
      <div class="status ${myTurn ? 'mine' : ''}">${st.winner ? '' : myTurn ? (sel ? 'Elige qué hacer con tu carta' : `✨ Tu turno, ${esc(pname(me))}`) : `Turno de ${esc(pname(them))}`}</div>
      <div class="opts" id="opts">${sel && myTurn ? opts.map((o, i) => `<button class="opt ${i === 0 ? 'best' : ''}" data-o="${i}">${esc(optLabel(o))}<small>${1 + o.all.length} cartas al cartón${o.kind === 'par' && st.last && st.last.by === them && o.take.includes(st.last.card) ? ' · <b>¡CAÍDA!</b>' : ''}${o.all.length === table.length ? ' · <b>¡LIMPIA!</b>' : ''}</small></button>`).join('') + `<button class="opt" data-o="-1">Tirar ${R.cname(sel)} a la mesa sin llevar${opts.length ? '<small>Puedes llevar, pero también puedes solo tirarla</small>' : ''}</button>` : ''}</div>
      <div class="myhand ${myTurn ? 'myturn' : ''}">${hand.map((c, i) => pCard(c, (c === sel ? 'sel' : '') + (newDeal || firstRender ? ' deal' : ''), newDeal || firstRender ? `animation-delay:${i * 90}ms` : '')).join('')}</div>
      <div class="pts">${ptsBox(me)}${ptsBox(them)}</div>`;
    shake = false;
    const def = st.winner ? `¡${esc(pname(st.winner))} ganó la chica! 🏆` : newDeal && !firstRender ? `Nueva mano, ${st.mano || 1} de 4. Reparte ${esc(pname(st.dealer))} 🐾` : myTurn ? `${fmt(st.log)}. Te toca 🐾` : fmt(st.log);
    const text = narrMsg || def;
    const nEl = $('#narr', g); nEl.dataset.last = lastNarr; narrate(nEl, text, !!narrMsg); lastNarr = text; narrMsg = '';
    $$('.myhand .pc', g).forEach(el => el.onclick = () => {
      if (st.turn !== me || st.winner) { toast('Espera tu turno'); return; }
      sel = sel === el.dataset.id ? null : el.dataset.id; sfx.card(); render();
    });
    $$('#opts [data-o]', g).forEach(b => {
      const i = +b.dataset.o;
      b.onmouseenter = () => { $$('.mesa .pc', g).forEach(x => x.classList.toggle('hl', i >= 0 && opts[i].all.includes(x.dataset.id))); };
      b.onclick = () => { const card = sel; sel = null; act(cur => R.c40Play(cur, P, me, card, i)); };
    });
    $('#next', g)?.addEventListener('click', () => store.tx(path, cur => cur && cur.winner ? R.c40NewChica(cur, P, other(cur.dealer)) : undefined).then(r => { if (r.value?.winner) recordWin('cuarenta', r.value); }));
    $('[data-reto]', g)?.addEventListener('click', () => openRetos('cuarenta'));
    if (st.winner && wonShown !== st.n && !firstRender) { if (st.winner === me) { confetti(); sfx.win(); } else { rain(16, ['💜', '💗', '🐾']); sfx.sad(); } }
    wonShown = st.winner ? st.n : null;
    prevTable = table; prevHand = new Set(hand); prevKey = key; firstRender = false;
  }
  const safeRender = () => { if (!renderT) render(); };
  current = { id: 'cuarenta', onPresence: safeRender, onGames: safeRender, cleanup() { clearTimeout(renderT); g.style.pointerEvents = ''; unsub(); } };
}

/* =====================================================================
   Arranque
   ===================================================================== */
async function boot() {
  const local = new URLSearchParams(location.search).has('local');
  try { store = CONFIG.firebase && !local ? await makeFirebaseStore(CONFIG.ROOM, CONFIG.firebase) : makeLocalStore(CONFIG.ROOM); }
  catch (e) { console.error(e); store = makeLocalStore(CONFIG.ROOM); store.error = 'No se pudo conectar con Firebase.'; }
  const q = new URLSearchParams(location.search).get('yo');
  const saved = lsGet('juegos:yo');
  if (local && P.includes(q)) { me = q; start(); return; }            // solo para probar en modo local
  if (P.includes(q)) { pinOk(q) ? enter(q) : renderPin(q); return; }
  P.includes(saved) && pinOk(saved) ? enter(saved) : renderWho();
}
boot();
</script>
