<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08060a">
<title>Nuestra App · Sam y Sofy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nuestra App">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08060a;--panel:#151018;--panel2:#1f1724;--line:#33253b;--text:#fbf0f6;--muted:#ad9bb5;--pink:#ff4fa3;--purple:#9d6bff;--red:#ff2d55;--ok:#3ee08f;--me:#9d6bff;--them:#ff4fa3;--felt:#14523d;--felt2:#0b3427;--fh:'Fredoka',system-ui,sans-serif;--fb:'Nunito',system-ui,sans-serif;--fs:'Caveat',cursive;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;color:var(--text);font:700 16px/1.4 var(--fb);background:radial-gradient(700px 500px at 0% -5%,rgba(157,107,255,.22),transparent 60%),radial-gradient(700px 520px at 100% 10%,rgba(255,79,163,.18),transparent 60%),radial-gradient(600px 400px at 50% 110%,rgba(255,45,85,.14),transparent 60%),var(--bg);background-attachment:fixed;-webkit-user-select:none;user-select:none;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{font-family:var(--fh);font-weight:600;margin:0}
.muted{color:var(--muted)}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
.bgh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgh i{position:absolute;bottom:-40px;font-style:normal;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.5}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(var(--bg) 70%,rgba(8,6,10,0))}
.brand{flex:1;display:flex;align-items:center;gap:9px}
.brand img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--pink);box-shadow:0 0 0 3px rgba(255,79,163,.2)}
.brand b{display:block;font:700 21px/1 var(--fh);background:linear-gradient(90deg,#fff,#ffb3d6);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font:700 12px var(--fb);color:var(--muted);margin-top:2px}
.back{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:28px;padding-bottom:4px}
.ttl{flex:1;font:600 21px var(--fh)}
.pill{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:14px;flex:none}
.pdot{width:9px;height:9px;border-radius:50%;background:#5b4d66}
.pdot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(62,224,143,.2);animation:blink 2s infinite}
@keyframes blink{50%{box-shadow:0 0 0 6px rgba(62,224,143,.05)}}
.ib{width:40px;height:40px;flex:none;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:18px;display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 20px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--pink),var(--purple));box-shadow:0 8px 24px -8px rgba(255,79,163,.6);transition:transform .12s}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.4;box-shadow:none}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:9px 15px;font-size:14px}
.btn.uno{background:linear-gradient(135deg,#ff2d55,#ffb020);font:700 19px var(--fh);letter-spacing:.5px;animation:pulse 1.1s infinite}
.btn.catch{background:linear-gradient(135deg,#ffb020,#ff2d55);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.link{color:var(--pink);font-weight:900;text-decoration:underline}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:18px;margin:4px 0 12px;background:linear-gradient(140deg,#2a0f22,#1a0f2a 55%,#0d0a12);border:1px solid #4a2742}
.hero::after{content:'♥';position:absolute;right:-18px;bottom:-60px;font-size:200px;color:rgba(255,79,163,.08);line-height:1}
.hero .hi{display:flex;gap:14px;align-items:center;position:relative;z-index:1}
.hero img{width:74px;height:74px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 0 4px var(--pink),0 10px 24px rgba(255,79,163,.4);flex:none;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
.hero h1{font-size:26px;line-height:1.1}
.hero .gl{font:700 22px var(--fs);color:#ffc2df;margin-top:3px}
.special{position:relative;z-index:1;margin-top:12px;padding:10px 12px;border-radius:14px;background:linear-gradient(90deg,rgba(255,45,85,.35),rgba(157,107,255,.35));font-weight:900;text-align:center;animation:pulse 2.4s infinite}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{padding:12px 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.stat b{display:block;font:700 28px/1 var(--fh);background:linear-gradient(90deg,var(--pink),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:13px;color:var(--muted)}
.dist{padding:14px;border-radius:20px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
.dist .ends{display:flex;justify-content:space-between;align-items:flex-end}
.dist .city{font-size:13px;color:var(--muted)}
.dist .city b{display:block;font:700 22px/1.1 var(--fh);color:var(--text)}
.dist .city.r{text-align:right}
.dist .line{position:relative;height:30px;margin:6px 4px 0}
.dist .line::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:2px dashed #5a4466}
.dist .line .d{position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
.dist .line .plane{position:absolute;top:50%;margin-top:-13px;font-size:20px;animation:fly 7s ease-in-out infinite alternate}
@keyframes fly{from{left:6%}to{left:calc(94% - 22px)}}
.dist .km{text-align:center;font-size:13px;color:var(--muted);margin-top:2px}
.dist .km b{color:var(--text)}
.nota{padding:14px 16px;border-radius:20px;margin:6px 0 14px;background:#fff6e9;color:#3a2232;box-shadow:0 10px 24px -10px rgba(0,0,0,.6);transform:rotate(-1deg);position:relative}
.nota::before{content:'';position:absolute;top:-8px;left:50%;margin-left:-34px;width:68px;height:18px;background:rgba(255,79,163,.55);transform:rotate(2deg);border-radius:3px}
.nota h3{font:800 15px var(--fb);color:#9b4a75}
.nota p{font:600 25px/1.15 var(--fs);margin:4px 0 2px;white-space:pre-wrap;word-break:break-word}
.nota small{font-size:12px;color:#9b7f8f}
.nota .w{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.nota .w button{font:800 13px var(--fb);color:#9b4a75;text-decoration:underline}
.tile{position:relative;display:block;border-radius:26px;padding:20px;margin:0 0 12px;overflow:hidden;border:1px solid var(--line);min-height:168px;transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile.uno{background:radial-gradient(circle at 88% 28%,rgba(255,45,85,.6),transparent 55%),radial-gradient(circle at 70% 95%,rgba(157,107,255,.5),transparent 50%),#120c16}
.tile.c40{background:radial-gradient(circle at 85% 30%,rgba(62,224,143,.3),transparent 55%),linear-gradient(160deg,#173d30,#0b2219)}
.tile h2{font-size:32px;position:relative}
.tile p{margin:2px 0 0;position:relative;max-width:60%;font-size:14px}
.tile .st{position:relative;margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:900;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15)}
.chip.go{background:var(--pink);border-color:transparent;animation:pulse 1.4s infinite}
.chip.gift{background:rgba(255,197,49,.18);border-color:rgba(255,197,49,.5)}
.tile .deco{position:absolute;right:6px;top:20px;display:flex;transform:rotate(8deg)}
.tile .deco>*:first-child{transform:rotate(-12deg) translateX(18px)}
.tile .deco>*{box-shadow:0 8px 20px rgba(0,0,0,.45)}
.card{padding:14px 16px;border-radius:20px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
.card h3{font-size:18px;margin-bottom:8px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;margin-bottom:8px}
.vs b{font:700 30px/1 var(--fh)}
.vs small{display:block;font-size:12px;color:var(--muted)}
.hist{display:grid;gap:6px;margin-top:6px}
.hist div{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:7px 10px;border-radius:12px;background:var(--panel2)}
.hist div span{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.hist em{font-style:normal;color:#ffd36b}
.kiss{display:flex;width:100%;margin:12px 0 0;justify-content:center;gap:10px;padding:14px;border-radius:18px;font:600 19px var(--fh);color:#fff;background:linear-gradient(135deg,#ff2d55,#ff4fa3 50%,#9d6bff);box-shadow:0 12px 30px -10px rgba(255,45,85,.7)}
.kiss:active{transform:scale(.97)}
.foot{text-align:center;margin-top:18px;font-size:14px}
.pin{padding-top:6vh}.pin img{border-color:var(--c)!important}
.dots{display:flex;justify-content:center;gap:14px;margin:22px 0 6px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--c);transition:background .15s,transform .15s}
.dots i.on{background:var(--c);transform:scale(1.15)}
.dots.bad{animation:shake .45s}.dots.bad i{border-color:#ff2d55}
.perr{min-height:20px;margin:6px 0 4px;color:#ff6b8a;font-weight:800;font-size:14px}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center;margin:8px 0 18px}
.pad button{height:76px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);font:600 30px var(--fh);color:var(--text)}
.pad button:active{background:var(--c);color:#fff;transform:scale(.94)}
.teamo{position:relative;overflow:hidden;padding:16px;border-radius:22px;margin-bottom:12px;background:linear-gradient(135deg,#3a0d22,#21102e);border:1px solid #5a2747}
.tah{display:flex;align-items:center;gap:12px}
.vsh{display:flex;justify-content:center;align-items:baseline;gap:12px;font:700 26px var(--fh);margin-bottom:6px}
.vsh em{font:900 13px var(--fb);color:var(--muted);font-style:normal;letter-spacing:.1em;text-transform:uppercase}
.vsr{padding:12px 0 4px;border-top:1px solid rgba(255,255,255,.08)}
.vsr:first-of-type{border-top:0}
.vsl{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:15px}
.vsl span{font-weight:700;font-size:12px;color:var(--muted)}
.vsn{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.vsn b{font:700 34px/1.05 var(--fh)}
.vsn b.bump{animation:pulse .5s}
.vsn i{font-style:normal;color:var(--muted);font-weight:900;font-size:12px}
.vsr .tabar{margin:8px 0 4px}
.vsw{font-size:12.5px;color:#ffb3d6;font-weight:800;text-align:center}
.tah>span{font-size:42px;animation:pulse 1.6s ease-in-out infinite}
.tah b{display:block;font:700 40px/1 var(--fh);background:linear-gradient(90deg,#ff7ab8,#c9a6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tah b.bump{animation:pulse .5s}
.tah small{display:block;color:var(--muted);font-size:13.5px;margin-top:3px}
.tabar{display:flex;height:10px;border-radius:999px;overflow:hidden;margin:14px 0 6px;background:var(--panel2)}
.tabar i{display:block;transition:width .6s}
.taw{display:flex;justify-content:space-between;font-weight:900;font-size:14px}
.tainfo{margin:10px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.tamon{display:flex;align-items:flex-end;justify-content:space-around;gap:6px;height:100px;margin:12px 0 2px}
.tamon div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}
.tamon i{display:block;width:70%;max-width:30px;border-radius:7px 7px 3px 3px}
.tamon .cnt{font-size:11px;font-weight:900;color:#ffb3d6}
.tamon small{font-size:11px;color:var(--muted)}
/* Cacómetro */
.caca{position:relative;overflow:hidden;padding:16px;border-radius:22px;margin-bottom:12px;background:linear-gradient(135deg,#3b2414,#1f140d 60%,#160f0b);border:1px solid #5f3d22}
.caca::after{content:'🚽';position:absolute;right:-14px;top:-18px;font-size:96px;opacity:.07;transform:rotate(14deg);pointer-events:none}
.caca h3{font-size:21px;text-align:center}
.caca .sub{text-align:center;font:700 19px var(--fs);color:#e7b98a;margin:0 0 10px}
.cvs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.cvs .cp b{display:block;font:700 44px/1 var(--fh)}
.cvs .cp small{display:block;font-size:12px;color:var(--muted)}
.cvs .cp .nm{font:600 17px var(--fh)}
.cvs .cp .last{font-size:11.5px;color:#c9a07a;margin-top:3px}
.cvs .cp b.bump{animation:pulse .5s}
.cvs em{font-style:normal;font-size:30px}
.cking{text-align:center;font-size:13px;font-weight:900;color:#ffd36b;margin:2px 0 4px}
.cbtn{display:flex;width:100%;justify-content:center;align-items:center;gap:10px;margin:12px 0 4px;padding:15px;border-radius:18px;font:600 21px var(--fh);color:#fff;background:linear-gradient(135deg,#7a4a22,#b9772f 55%,#e09a45);box-shadow:0 12px 28px -10px rgba(224,154,69,.6);transition:transform .12s}
.cbtn:active{transform:scale(.96)}
.cbtn span{font-size:28px;display:inline-block}
.cbtn.go span{animation:plop .5s}
@keyframes plop{0%{transform:translateY(-14px) scale(.6)}60%{transform:translateY(2px) scale(1.15,.85)}100%{transform:none}}
.ctype{margin:8px 0 2px;text-align:center}
.ctype p{margin:0 0 6px;font-size:12.5px;color:#e7b98a}
.ctype div{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ctype button{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid #5f3d22;font-size:13px;font-weight:800}
.ctype button.on{background:#b9772f;border-color:#e09a45}
.cweek{display:flex;align-items:flex-end;justify-content:space-around;gap:4px;height:82px;margin:14px 0 2px}
.cweek>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.cweek .bars{display:flex;align-items:flex-end;gap:2px;height:58px}
.cweek .bars i{display:block;width:9px;border-radius:5px 5px 2px 2px;min-height:3px}
.cweek small{font-size:10.5px;color:var(--muted)}
.cweek .hoy small{color:#ffd36b;font-weight:900}
.cfacts{font-size:12.5px;color:#d9b48f;text-align:center;margin:8px 0 0;line-height:1.55}
.chist{display:grid;gap:5px;margin-top:10px}
.chist div{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.05)}
.chist div span{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.caca .talinks{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:13px}
.caca .link{color:#e09a45}
.teamo .row{margin-top:12px}
.btn.wa{background:linear-gradient(135deg,#25d366,#128c7e);box-shadow:0 10px 24px -12px rgba(37,211,102,.8)}
.talinks{display:flex;justify-content:center;gap:18px;margin-top:10px;font-size:13.5px}
.copy{display:flex;gap:8px;align-items:center;margin:6px 0 10px}
.copy code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;padding:9px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:12px}
.copy button{flex:none;padding:8px 12px;border-radius:10px;background:var(--pink);color:#fff;font-weight:900;font-size:13px}
.steps{margin:6px 0 12px;padding-left:22px;line-height:1.55;font-size:14.5px}
.steps li{margin:3px 0}
.filebtn{display:block;text-align:center;cursor:pointer;margin:8px 0}
.warn{padding:10px 12px;border-radius:14px;background:rgba(255,45,85,.12);border:1px solid rgba(255,45,85,.35);font-size:14px;margin:8px 0}
.map{display:grid;gap:6px;margin:8px 0}
.map div{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:12px;background:var(--panel2);font-size:14px}
.big{font:700 34px var(--fh);text-align:center;margin:10px 0 2px}
.note{background:rgba(255,45,85,.1);border:1px solid rgba(255,45,85,.35);border-radius:14px;padding:12px 14px;font-size:14px;margin:0 0 12px}
.who{text-align:center;padding:9vh 0 0}.who h1{font-size:30px;margin:14px 0 6px}
.who img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 0 0 6px var(--pink)}
.whob{display:block;width:100%;border-radius:20px;padding:20px;margin-top:12px;font:600 24px var(--fh);color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 45%,#000))}
.opp{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px;transition:box-shadow .3s}
.opp .nm{font:600 17px var(--fh);display:flex;align-items:center;gap:7px}
.opp .nm i{width:10px;height:10px;border-radius:50%;background:var(--them)}
.opp .sub{font-size:12.5px;color:var(--muted)}
.opp .fan{margin-left:auto;display:flex;align-items:center}
.opp .fan .cback{margin-left:-15px}
.opp .fan .cback:first-child{margin-left:0}
.opp .count{margin-left:8px;font:700 19px var(--fh)}
.opp.turn{box-shadow:0 0 0 2px var(--them),0 0 22px -4px var(--them)}
.badge{font:900 11px var(--fb);padding:2px 8px;border-radius:999px;background:linear-gradient(135deg,#ff2d55,#ffb020);color:#fff;animation:pulse 1s infinite}
.reto{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:14px;margin-bottom:8px;background:linear-gradient(90deg,rgba(255,197,49,.14),rgba(255,79,163,.1));border:1px dashed rgba(255,197,49,.55);font-size:13.5px}
.reto b{color:#ffd36b}
.reto span{margin-left:auto;font-size:12px;color:var(--muted);text-decoration:underline;white-space:nowrap}
.narr{display:flex;align-items:center;gap:10px;margin:8px 0 2px;min-height:46px}
.narr img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #fff;flex:none;box-shadow:0 0 0 2px var(--pink)}
.narr img.wag{animation:wag .5s ease-in-out 3}
@keyframes wag{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.narr .b{position:relative;flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:8px 12px;font-size:14px;line-height:1.3}
.narr .b::before{content:'';position:absolute;left:-7px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:0;border-right-color:var(--line)}
.narr .b.new{animation:bub .35s ease-out}
@keyframes bub{from{transform:scale(.9);opacity:.3}}
.status{text-align:center;font:600 19px var(--fh);min-height:28px;margin:6px 0 0}
.status.mine{color:#ffc2df;animation:pulse 1.6s infinite}
.cback{width:var(--w,28px);aspect-ratio:5/7;border-radius:calc(var(--w,28px)*.14);border:2px solid #ff4fa3;background:radial-gradient(circle at 50% 50%,transparent 32%,rgba(0,0,0,.35) 33%),repeating-conic-gradient(from 0deg,#120a14 0 15deg,#2b0f22 15deg 30deg);position:relative;flex:none;display:grid;place-items:center;color:#ff4fa3;font:700 calc(var(--w,28px)*.32) var(--fh);box-shadow:0 3px 8px rgba(0,0,0,.4)}
.cback::after{content:'♥';font-size:calc(var(--w,28px)*.42);text-shadow:0 0 8px rgba(255,79,163,.8)}
.cback.big::after{content:'S♥S';font-size:calc(var(--w)*.24);letter-spacing:1px}
.uc{--w:64px;width:var(--w);aspect-ratio:5/7;border-radius:calc(var(--w)*.14);background:var(--cc);border:calc(var(--w)*.05) solid #fff;position:relative;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.4);color:#fff;font-family:var(--fh);font-weight:700;overflow:hidden;transition:transform .18s,opacity .2s,box-shadow .2s}
.uc .mid{position:absolute;inset:14% 9%;border-radius:50%;background:#fff;transform:rotate(-28deg);display:grid;place-items:center}
.uc .mid b{transform:rotate(28deg);color:var(--cc);font-size:calc(var(--w)*.42);line-height:1;text-shadow:1px 1px 0 rgba(0,0,0,.2)}
.uc .tl,.uc .br{position:absolute;font-size:calc(var(--w)*.2);line-height:1;text-shadow:1px 1px 0 rgba(0,0,0,.35)}
.uc .tl{left:7%;top:5%}.uc .br{right:7%;bottom:5%;transform:rotate(180deg)}
.c-r{--cc:#ff2d55}.c-y{--cc:#f5b71c}.c-g{--cc:#2bb466}.c-b{--cc:#3a7ce0}.c-w{--cc:#120a14}
.uc.c-w .mid{background:conic-gradient(#ff2d55 0 25%,#3a7ce0 0 50%,#2bb466 0 75%,#f5b71c 0)}
.uc.c-w .mid b{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.hand{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:10px 4px 6px;min-height:110px;border-radius:22px;transition:background .3s}
.hand.myturn{background:radial-gradient(ellipse at 50% 100%,rgba(255,79,163,.18),transparent 70%)}
.hand .uc.ok{transform:translateY(-6px);box-shadow:0 0 0 3px #fff,0 8px 20px rgba(255,255,255,.25);cursor:pointer}
.hand .uc.no{opacity:.45;filter:saturate(.6)}
.hand.myturn .uc.ok{animation:lift 1.6s ease-in-out infinite}
@keyframes lift{50%{transform:translateY(-10px)}}
.board{display:flex;align-items:center;justify-content:center;gap:24px;padding:20px 10px;border-radius:26px;background:radial-gradient(circle at 50% 40%,#2c1430,#110a14);border:1px solid #3d2242;position:relative;margin-bottom:4px;box-shadow:inset 0 0 40px rgba(0,0,0,.5)}
.board::before{content:'';position:absolute;inset:8px;border-radius:20px;border:1px dashed rgba(255,79,163,.18);pointer-events:none}
.board .uc{--w:98px}
.board.won,.mesa.won{min-height:390px}
.hist .tx{flex:1;min-width:0;margin:0!important;font-size:13.5px!important;color:var(--text)!important;white-space:normal!important}
.pile{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:800}
.pile .cback{--w:76px}
.pile.can .cback{box-shadow:0 0 0 3px #fff,0 0 26px rgba(255,79,163,.7);animation:lift 1.6s ease-in-out infinite}
.colorring{position:absolute;right:14px;top:14px;padding:5px 11px;border-radius:999px;background:var(--cc);font:900 12px var(--fb);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);box-shadow:0 0 18px var(--cc)}
.scorebar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);font-size:14px;margin-top:10px}
.scorebar b{font:700 21px var(--fh)}
.scorebar .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}
.pc{--w:58px;width:var(--w);aspect-ratio:5/7;border-radius:calc(var(--w)*.12);background:linear-gradient(160deg,#fffdf8,#f3ece2);color:#1f1a24;position:relative;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.4);font-family:var(--fh);font-weight:700;transition:transform .18s,box-shadow .2s,opacity .2s}
.pc.red{color:#d81f45}
.pc .tl{position:absolute;left:8%;top:5%;font-size:calc(var(--w)*.28);line-height:.95;text-align:center}
.pc .tl small{display:block;font-size:calc(var(--w)*.22)}
.pc .mid{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w)*.55);padding-top:12%}
.pc .mid.face span{display:grid;place-items:center;width:62%;aspect-ratio:3/4;border-radius:8px;border:2px solid currentColor;font-size:calc(var(--w)*.34);background:color-mix(in srgb,currentColor 7%,transparent)}
.mesa{min-height:156px;padding:16px 10px;border-radius:26px;background:radial-gradient(circle at 50% 40%,var(--felt),var(--felt2));border:7px solid #2a0f22;box-shadow:inset 0 0 34px rgba(0,0,0,.5),0 0 0 1px #4a2742;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center;position:relative;margin-bottom:4px}
.mesa::before{content:'S ♥ S';position:absolute;bottom:6px;right:12px;font:700 13px var(--fh);color:rgba(255,255,255,.18);letter-spacing:2px}
.mesa .empty{color:rgba(255,255,255,.55);font-weight:800;font-size:14px}
.mesa .pc.hl{box-shadow:0 0 0 3px var(--pink),0 0 18px rgba(255,79,163,.8);transform:translateY(-4px)}
.mesa .pc.lastc{outline:2px dashed rgba(255,255,255,.75);outline-offset:3px}
.mesa.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-7px) rotate(-1deg)}40%{transform:translateX(7px) rotate(1deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.info{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.info span{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.myhand{display:flex;justify-content:center;gap:8px;padding:14px 0 6px;min-height:120px;border-radius:22px;transition:background .3s}
.myhand.myturn{background:radial-gradient(ellipse at 50% 100%,rgba(255,79,163,.18),transparent 70%)}
.myhand .pc{--w:64px;cursor:pointer}
.myhand.myturn .pc{box-shadow:0 0 0 2px rgba(255,255,255,.65),0 6px 14px rgba(0,0,0,.4)}
.myhand .pc.sel{transform:translateY(-16px) rotate(-3deg);box-shadow:0 0 0 3px var(--pink),0 10px 24px rgba(255,79,163,.55)}
.opts{display:grid;gap:8px;margin:6px 0}
.opt{text-align:left;padding:11px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-weight:900;font-size:15px;animation:bub .25s ease-out}
.opt.best{border-color:var(--pink);background:rgba(255,79,163,.14)}
.opt small{display:block;font-weight:700;color:var(--muted);font-size:12px}
.opt small b{color:#ffd36b}
.pts{display:flex;gap:10px;margin:8px 0}
.pts>div{flex:1;padding:10px 12px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.pts .n{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.pts .n b{font:700 27px var(--fh)}
.bar{height:9px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.3,1.4,.6,1)}
.pts .sub{font-size:12px;color:var(--muted);margin-top:5px}
.in-b{animation:inb .45s cubic-bezier(.25,1.3,.5,1)}
.in-t{animation:int .45s cubic-bezier(.25,1.3,.5,1)}
@keyframes inb{from{transform:translateY(220px) rotate(-25deg) scale(.7);opacity:0}}
@keyframes int{from{transform:translateY(-220px) rotate(25deg) scale(.7);opacity:0}}
.deal{animation:deal .5s cubic-bezier(.25,1.3,.5,1) backwards}
@keyframes deal{from{transform:translateY(-260px) rotate(180deg) scale(.4);opacity:0}}
.out-b{animation:outb .42s ease-in forwards}
.out-t{animation:outt .42s ease-in forwards}
@keyframes outb{to{transform:translateY(260px) scale(.6) rotate(-20deg);opacity:0}}
@keyframes outt{to{transform:translateY(-260px) scale(.6) rotate(20deg);opacity:0}}
.sheet-bg{position:fixed;inset:0;z-index:78;background:rgba(8,6,10,.6);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{width:100%;max-width:560px;max-height:84vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .28s ease-out;-webkit-user-select:text;user-select:text}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.sheet h3{font-size:22px;margin-bottom:8px}
.sheet p,.sheet li{font-size:14px;color:#e2d4ea}
.sheet ul{padding-left:18px;margin:6px 0}
.sheet h4{font:600 16px var(--fh);margin:14px 0 4px}
.sheet textarea,.sheet input[type=text]{width:100%;font:600 16px var(--fb);color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;outline:none}
.sheet textarea:focus,.sheet input:focus{border-color:var(--pink)}
.tog{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);margin:8px 0;font-size:14px}
.tog input{width:22px;height:22px;accent-color:var(--pink);flex:none}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.colors button{height:80px;border-radius:20px;background:var(--cc);color:#fff;font:700 19px var(--fh);text-shadow:0 1px 3px rgba(0,0,0,.4);box-shadow:0 8px 20px -6px var(--cc)}
.retos{display:grid;gap:8px;margin:8px 0}
.retos button{text-align:left;padding:12px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-weight:800}
.over{position:absolute;inset:0;z-index:5;border-radius:26px;background:rgba(8,6,10,.88);display:grid;place-items:center;align-content:center;gap:10px;text-align:center;padding:16px;animation:bub .4s ease-out}
.over h2{font-size:28px}
.over .prize{padding:10px 14px;border-radius:14px;background:rgba(255,197,49,.14);border:1px dashed rgba(255,197,49,.6);font-size:14px}
.over .prize b{color:#ffd36b}
.pop{position:fixed;left:50%;top:40%;z-index:80;transform:translate(-50%,-50%);pointer-events:none;text-align:center;animation:pop 2s ease-out forwards}
.pop b{display:block;font:700 46px var(--fh);color:#fff;text-shadow:0 4px 20px rgba(255,79,163,.95),0 2px 0 #9d6bff;white-space:nowrap}
.pop span{display:inline-block;margin-top:4px;padding:5px 13px;border-radius:999px;background:rgba(20,10,22,.85);font-weight:900}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(3deg)}30%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-75%)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:#1d1322;border:1px solid var(--line);padding:11px 16px;border-radius:16px;font-weight:800;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.6);max-width:calc(100% - 32px);text-align:center}
.reacts{display:flex;justify-content:center;gap:5px;margin:12px 0 0}
.reacts button{width:42px;height:42px;border-radius:13px;font-size:21px;background:var(--panel2);border:1px solid var(--line);transition:transform .1s}
.reacts button:active{transform:scale(.85)}
.flyE{position:fixed;z-index:85;font-size:56px;pointer-events:none;animation:flyE 2.2s ease-out forwards}
@keyframes flyE{0%{opacity:0;transform:translateY(30px) scale(.4)}15%{opacity:1;transform:translateY(0) scale(1.25)}100%{opacity:0;transform:translateY(-170px) scale(1)}}
.rain{position:fixed;top:-50px;z-index:84;pointer-events:none;animation:rain linear forwards}
@keyframes rain{to{transform:translateY(115vh) rotate(var(--r))}}
/* música */
.mus{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;width:min(540px,calc(100% - 20px));display:flex;align-items:center;gap:10px;padding:8px;border-radius:20px;background:rgba(28,16,32,.94);border:1px solid #4a2742;box-shadow:0 14px 34px rgba(0,0,0,.6),0 0 0 1px rgba(255,79,163,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.mus.off{transform:translate(-50%,160%)}
.mus .mv{width:112px;height:63px;flex:none;border-radius:12px;overflow:hidden;background:#000}
.mus .mv iframe,.mus .mv>div{width:100%;height:100%;display:block;border:0}
.mus .mt{flex:1;min-width:0;cursor:pointer}
.mus .mt b{display:block;font:600 15px/1.2 var(--fh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mus .mt small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mus .mb{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:17px;background:var(--panel2);border:1px solid var(--line)}
.mus .mb.pp{background:linear-gradient(135deg,var(--pink),var(--purple));border:0;color:#fff}
body.has-music .wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
body.has-music .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-right:6px}
.eq i{width:3px;background:var(--pink);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.songs{display:grid;gap:6px;margin:10px 0}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 13px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font:800 13.5px var(--fb);white-space:nowrap}
.tab.on{background:linear-gradient(135deg,var(--c1,#ff4fa3),var(--c2,#9d6bff));border-color:transparent;color:#fff}
.lhead{position:relative;overflow:hidden;border-radius:20px;padding:16px;margin:4px 0 10px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
.lhead::after{content:attr(data-ic);position:absolute;right:-6px;bottom:-26px;font-size:96px;opacity:.25}
.lhead h4{margin:0;font:600 22px var(--fh);color:#fff}
.lhead p{margin:2px 0 10px;color:rgba(255,255,255,.85)!important;font-size:13px}
.lhead .row{justify-content:flex-start;margin:0}
.lhead .btn{background:#fff;color:#c2185b;box-shadow:none;padding:9px 15px;font-size:14px}
.lhead .btn.ghost{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4)}
.song{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.song.on{border-color:var(--pink);background:rgba(255,79,163,.12)}
.song .n{width:26px;flex:none;text-align:center;color:var(--muted);font:700 13px var(--fh)}
.song .tx{flex:1;min-width:0}
.song .tx b{display:block;font:600 15px/1.25 var(--fh)}
.song .tx small{display:block;font-size:12px;color:var(--muted)}
.song .x{flex:none;font-size:13px;color:var(--muted);padding:6px}
.song.broken{opacity:.5}
.musiccard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:22px;margin-bottom:12px;background:linear-gradient(120deg,#2b0f22,#1b0f2c);border:1px solid #4a2742}
.musiccard .vin{width:58px;height:58px;flex:none;border-radius:50%;background:radial-gradient(circle,#ff4fa3 0 16%,#120a14 17% 22%,#2b2030 23% 30%,#120a14 31% 38%,#2b2030 39% 46%,#120a14 47%);box-shadow:0 0 0 3px #2b2030;animation:spin 6s linear infinite}
.gchips{display:flex;gap:8px;overflow-x:auto;margin:-4px 0 14px;padding-bottom:2px;scrollbar-width:none}
.gchips::-webkit-scrollbar{display:none}
.gchip{flex:none;display:flex;align-items:center;gap:6px;padding:9px 13px 9px 9px;border-radius:999px;font:800 13px var(--fb);color:#fff;white-space:nowrap;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 4px 14px rgba(0,0,0,.25)}
.gchip span{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.22);font-size:13px}
.musiccard .vin.stop{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.musiccard b{display:block;font:600 19px var(--fh)}
.musiccard small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.ded{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);z-index:75;width:min(520px,calc(100% - 24px));display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:linear-gradient(120deg,#ff2d55,#ff4fa3 55%,#9d6bff);color:#fff;box-shadow:0 16px 40px -10px rgba(255,45,85,.8);animation:dedin .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes dedin{from{transform:translate(-50%,-40px) scale(.9);opacity:0}}
.ded .ic{font-size:30px}
.ded .tx{flex:1;min-width:0;font-size:13px}
.ded .tx b{display:block;font:600 17px/1.2 var(--fh)}
.ded button{flex:none;padding:9px 14px;border-radius:999px;background:#fff;color:#c2185b;font-weight:900}
.ded .cl{background:none;color:#fff;padding:4px;font-size:18px}
#confetti{position:fixed;inset:0;width:100vw;height:100vh;z-index:83;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
@media (min-width:480px){.uc{--w:70px}.board .uc{--w:106px}.myhand .pc{--w:72px}.pc{--w:62px}}
/* ===== Cosas nuevas ===== */
input,textarea{-webkit-user-select:text;user-select:text}
.inp,.sheet input[type=date],.sheet textarea{width:100%;font:600 16px var(--fb);color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;outline:none;color-scheme:dark;resize:vertical}
.inp:focus,.sheet input[type=date]:focus{border-color:var(--pink)}
.sec{display:flex;align-items:baseline;gap:8px;font:600 22px var(--fh);margin:22px 4px 10px}
.sec small{font:700 13px var(--fb);color:var(--muted);margin-left:auto}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mtile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:122px;padding:14px;border-radius:22px;overflow:hidden;background:linear-gradient(150deg,color-mix(in srgb,var(--c1) 55%,#120c16),color-mix(in srgb,var(--c2) 32%,#0c0810));border:1px solid rgba(255,255,255,.1);transition:transform .15s;text-align:left;color:#fff}
.mtile:active{transform:scale(.97)}
.mtile .ic{position:absolute;right:10px;top:8px;font-size:40px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.mtile b{font:600 18px/1.1 var(--fh)}
.mtile small{font-size:12px;color:rgba(255,255,255,.78);margin-top:3px;line-height:1.25}
.mtile .chip{position:absolute;left:10px;top:10px;font-size:11px;padding:3px 8px}
.vernos{display:block;width:100%;margin-top:10px;padding:10px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-size:14px;font-weight:800;text-align:center}
.vernos b{color:#ffd36b}
.vernos.hoy{background:linear-gradient(90deg,rgba(255,45,85,.35),rgba(157,107,255,.35));animation:pulse 2.4s infinite}
/* Pregunta del día */
.dq{padding:16px;border-radius:22px;margin-bottom:12px;background:linear-gradient(140deg,#2d2410,#1d1428 70%);border:1px solid #5a4a22}
.dqh{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:13px;color:#ffd36b;margin-bottom:6px}
.dqh .link{font-size:12px;color:#ffd36b}
.dq h3{font:600 20px/1.25 var(--fh);margin-bottom:10px}
/* Boda */
.bodat{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;margin-bottom:12px;background:linear-gradient(135deg,#f6e7d0,#f3c9d9 60%,#d9c4f2);color:#3a2232;box-shadow:0 14px 30px -14px rgba(243,201,217,.55)}
.bodat:active{transform:scale(.98)}
.bodat .ring{font-size:40px;animation:bob 3s ease-in-out infinite}
.bodat .t{font:700 24px/1 var(--fs);color:#8a2a5c}
.bodat b{display:block;font:700 30px/1.05 var(--fh);color:#8a2a5c;margin-top:2px}
.bodat small{display:block;font-size:12.5px;color:#6b4a5c;font-weight:800;margin-top:2px}

const dayMs = 864e5;
const ymd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today0 = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
function fechas() {
  const t = today0(), nov = ymd(CONFIG.FECHAS.novios), ta = ymd(CONFIG.FECHAS.teAmo);
  const dias = Math.round((t - nov) / dayMs);
  let meses = (t.getFullYear() - nov.getFullYear()) * 12 + t.getMonth() - nov.getMonth(); if (t.getDate() < nov.getDate()) meses--;
  const sig = new Date(nov.getFullYear(), nov.getMonth() + meses + 1, nov.getDate());
  const faltan = t.getDate() === nov.getDate() && meses > 0 ? 0 : Math.round((sig - t) / dayMs);
  const years = t.getFullYear() - nov.getFullYear();
  let special = '';
  if (t.getMonth() === nov.getMonth() && t.getDate() === nov.getDate() && years > 0) special = `🎉 ¡Hoy cumplimos ${years} año${years > 1 ? 's' : ''} de novios! 💜`;
  else if (t.getDate() === nov.getDate() && meses > 0) special = `💜 ¡Feliz mesiversario! Hoy cumplimos ${meses} ${meses === 1 ? 'mes' : 'meses'} 💜`;
  else if (t.getMonth() === ta.getMonth() && t.getDate() === ta.getDate() && t > ta) special = '💗 Hoy es el aniversario de nuestro primer "te amo" 💗';
  else if (t.getMonth() === 1 && t.getDate() === 14) special = '💘 ¡Feliz San Valentín! 💘';
  else if (faltan === 1) special = `✨ Mañana cumplimos ${meses + 1} ${meses + 1 === 1 ? 'mes' : 'meses'} ✨`;
  return { dias, meses, faltan, special };
}
function km() {
  const [a, b] = P.map(p => CONFIG.PLAYERS[p]), r = Math.PI / 180;

}

  addEventListener('pagehide', () => { if (presKey) { tree = load(); put(PRES + presKey + '/on', false); save(); } });

    on(path, cb) { const s = { path, cb, last: undefined }; subs.add(s); queueMicrotask(() => { if (!subs.has(s)) return; const v = get(path); s.last = JSON.stringify(v); cb(v); }); return () => subs.delete(s); },

  const db = D.getDatabase(A.initializeApp(cfg));
  const Rf = p => D.ref(db, `rooms/${room}/${p}`);
  let offset = 0, presKey = null, presData = null, warned = false;
  D.onValue(D.ref(db, '.info/serverTimeOffset'), s => { offset = s.val() || 0; });
  D.onValue(D.ref(db, '.info/connected'), s => { if (s.val() && presKey) { D.onDisconnect(Rf(PRES + presKey)).update({ on: false }); D.update(Rf(PRES + presKey), { on: true, ...presData }); } });
  const fail = e => { console.error(e); if (!warned) { warned = true; toast('Firebase rechazó la conexión. Revisa las reglas y el código de sala.', 6000); } };
  return {
    mode: 'firebase',
    on(p, cb) { return D.onValue(Rf(p), s => cb(s.val()), fail); },
    set: (p, v) => D.set(Rf(p), v ?? null).catch(fail),
    update: (p, o) => D.update(Rf(p), o).catch(fail),
    async tx(p, fn) {
      // Devolver undefined cancela la jugada; nunca devolvemos null (borraría la partida).
      try { const r = await D.runTransaction(Rf(p), cur => { const n = fn(cur); return n == null ? undefined : n; }); return { committed: r.committed, value: r.snapshot.val() }; }
      catch (e) { fail(e); return { committed: false, value: null }; }
    },
    presence(key, data) { presKey = key; presData = data; D.onDisconnect(Rf(PRES + key)).update({ on: false }); return D.update(Rf(PRES + key), { on: true, ...data }).catch(fail); },
    now: () => Date.now() + offset,
  };
}

const lastTurnSeen = {};
function pushTurn(g, v) {
  const prev = lastTurnSeen[g];

}
function updateTitle() {
  const all = { ...games, ...jgames };
  const n = Object.keys(all).filter(g => all[g] && !all[g].winner && all[g].turn === me).length;
  document.title = (n ? '● Tu turno · ' : '') + 'Nuestra App';
}
function route() {
  const id = location.hash.replace(/^#\/?/, '');

  (SCREENS[id] || mountLobby)();
  store.presence(me, { at: current.id, on: !document.hidden });
}

const retoValid = g => { const r = retos[g], s = games[g]; return r && s && r.n === s.n ? r : null; };

  const put = text => { store.set('cartas/retos/' + g, { text, by: me, n: s.n, t: store.now() }); sh.remove(); toast('🎁 ¡Premio puesto! A ganar'); sfx.pop(); };

}
const retoBar = g => { const r = retoValid(g); return r ? `<button class="reto" data-reto>🎁 <div>Premio: <b>${esc(r.text)}</b></div><span>cambiar</span></button>` : `<button class="reto" data-reto>🎁 <div>Ponle un premio a ${g === 'uno' ? 'esta ronda' : 'esta chica'}</div><span>elegir</span></button>`; };
const prizeLine = (g, winner) => { const r = retoValid(g); return r && winner ? `<div class="prize">🎁 ${esc(pname(other(winner)))} le debe a ${esc(pname(winner))}:<br><b>${esc(r.text)}</b></div>` : ''; };
// Guarda cada resultado una sola vez: la clave es el número de ronda o chica
function recordWin(g, st) {

/* ---------- Cacómetro: cuántas veces vamos al baño ----------
   Cada caca se guarda en cartas/cacas/<id> = { p, t, k }. El día cuenta según la hora de cada uno. */
const CACA_TIPOS = [['ok', '😌 Normal'], ['fast', '🚀 Exprés'], ['slow', '🐢 Lenta'], ['boom', '💥 Explosiva'], ['gas', '💨 Con gases'], ['rip', '😵 Sufrida']];
const CACA_TRONO = { sam: 'el rey', sofy: 'la reina' };
const CACA_FRASES = ['Gia no quiere saber nada de esto 🐾', 'Lo que pasa en el baño, se cuenta aquí', 'Ciencia pura', 'El amor es contarse todo', 'Nadie gana, pero alguien va primero'];
const cacaDay = (t, p) => { try { return new Intl.DateTimeFormat('en-CA', { timeZone: CONFIG.PLAYERS[p].tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(t)); } catch { return new Date(t).toISOString().slice(0, 10); } };
const cacaList = () => Object.entries(cacas || {}).filter(([, v]) => v && v.p && v.t).map(([id, v]) => ({ id, ...v })).sort((a, b) => a.t - b.t);
const hace = t => {
  const m = Math.max(0, Math.round((store.now() - t) / 60000));
  if (m < 1) return 'ahora mismo'; if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `hace ${h} h`;
  const d = Math.round(h / 24); return `hace ${d} ${d === 1 ? 'día' : 'días'}`;
};
const dayShift = (key, n) => { const [y, m, d] = key.split('-').map(Number); const x = new Date(Date.UTC(y, m - 1, d + n)); return x.toISOString().slice(0, 10); };
let cacaFrase = null, cacaPrev = {};
function renderCaca(el) {
  if (!el) return;
  cacaFrase ??= pick(CACA_FRASES);
  const list = cacaList(), [a, b] = P, now = store.now();
  const of = p => list.filter(c => c.p === p);
  const hoy = p => of(p).filter(c => cacaDay(c.t, p) === cacaDay(now, p)).length;
  const porDia = p => of(p).reduce((m, c) => { const k = cacaDay(c.t, p); m[k] = (m[k] || 0) + 1; return m; }, {});
  const racha = p => { const d = porDia(p); let k = cacaDay(now, p); if (!d[k]) k = dayShift(k, -1); let n = 0; while (d[k]) { n++; k = dayShift(k, -1); } return n; };
  const record = p => Math.max(0, ...Object.values(porDia(p)));
  const tot = p => of(p).length;
  const last = p => of(p).pop();
  const lead = tot(a) === tot(b) ? null : tot(a) > tot(b) ? a : b;

  const col = p => {
    const l = last(p), n = hoy(p);
    return `<div class="cp"><div class="nm" style="color:${pcol(p)}">${lead === p ? '👑 ' : ''}${esc(pname(p))}</div>
      <b data-cn="${p}" style="color:${pcol(p)}">${n}</b><small>hoy</small>
      <div class="last">${l ? `última ${hace(l.t)}` : 'todavía nada'}</div></div>`;
  };
  // Últimos 7 días (según mi calendario)
  const hk = cacaDay(now, me), days = Array.from({ length: 7 }, (_, i) => dayShift(hk, i - 6));
  const da = porDia(a), db = porDia(b), mx = Math.max(1, ...days.map(k => Math.max(da[k] || 0, db[k] || 0)));
  const wd = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('es', { weekday: 'short' }).replace('.', ''); };
  const week = days.map(k => `<div class="${k === hk ? 'hoy' : ''}"><div class="bars"><i style="height:${Math.round((da[k] || 0) / mx * 56) || 3}px;background:${pcol(a)};opacity:${da[k] ? 1 : .25}"></i><i style="height:${Math.round((db[k] || 0) / mx * 56) || 3}px;background:${pcol(b)};opacity:${db[k] ? 1 : .25}"></i></div><small>${k === hk ? 'hoy' : wd(k)}</small></div>`).join('');

  const facts = [];
  if (list.length) {
    facts.push(`En total: <b style="color:${pcol(a)}">${tot(a)}</b> de ${esc(pname(a))} y <b style="color:${pcol(b)}">${tot(b)}</b> de ${esc(pname(b))}`);
    const ra = racha(a), rb = racha(b);
    if (ra > 1 || rb > 1) facts.push(`🔥 Racha: ${esc(pname(a))} ${ra} ${ra === 1 ? 'día' : 'días'} · ${esc(pname(b))} ${rb} ${rb === 1 ? 'día' : 'días'}`);
    const rcA = record(a), rcB = record(b);
    if (Math.max(rcA, rcB) > 1) { const w = rcA >= rcB ? a : b; facts.push(`🏅 Récord en un día: <b>${Math.max(rcA, rcB)}</b> de ${esc(pname(w))}`); }
    const tipos = list.filter(c => c.k).reduce((m, c) => { m[c.k] = (m[c.k] || 0) + 1; return m; }, {});
    const top = Object.entries(tipos).sort((x, y) => y[1] - x[1])[0];
    if (top) facts.push(`La más común: ${esc(CACA_TIPOS.find(t => t[0] === top[0])?.[1] || top[0])}`);
  }
  const mine = last(me), fresh = mine && now - mine.t < 15 * 60000;
  const hist = list.slice(-5).reverse().map(c => {
    const tipo = CACA_TIPOS.find(t => t[0] === c.k)?.[1];
    const when = new Date(c.t).toLocaleString('es', { weekday: 'short', hour: '2-digit', minute: '2-digit', timeZone: CONFIG.PLAYERS[c.p].tz });
    return `<div>💩 <b style="color:${pcol(c.p)}">${esc(pname(c.p))}</b>${tipo ? ` · ${esc(tipo)}` : ''}<span>${esc(when)} en ${esc(CONFIG.PLAYERS[c.p].city)}</span></div>`;
  }).join('');

  el.innerHTML = `<h3>💩 Cacómetro</h3><p class="sub">${esc(cacaFrase)}</p>
    <div class="cvs">${col(a)}<em>🚽</em>${col(b)}</div>
    <div class="cking">${lead ? `👑 ${esc(pname(lead))} es ${esc(CACA_TRONO[lead] || 'el amo')} del trono` : list.length ? '🤝 Empate en el trono' : 'El trono está libre'}</div>
    <button class="cbtn" id="cadd"><span>💩</span>¡Una mierda más!</button>
    ${fresh ? `<div class="ctype"><p>¿Cómo estuvo esa?</p><div>${CACA_TIPOS.map(([k, l]) => `<button data-ck="${k}" class="${mine.k === k ? 'on' : ''}">${esc(l)}</button>`).join('')}</div></div>` : ''}
    <div class="cweek">${week}</div>
    ${facts.length ? `<p class="cfacts">${facts.join('<br>')}</p>` : '<p class="cfacts">Aquí se va a contar cada visita al trono. Que empiece la competencia 🏁</p>'}
    ${hist ? `<div class="chist">${hist}</div>` : ''}
    ${mine && now - mine.t < 6 * 3600000 ? '<div class="talinks"><button class="link" id="cundo">↩️ Quitar mi última</button></div>' : ''}`;

  for (const p of P) { const n = hoy(p); if (cacaPrev[p] !== undefined && n > cacaPrev[p]) $(`[data-cn="${p}"]`, el)?.classList.add('bump'); cacaPrev[p] = n; }

  $('#cadd', el).onclick = () => {
    const t = store.now();
    store.set(`cartas/cacas/${me}_${t.toString(36)}${Math.random().toString(36).slice(2, 5)}`, { p: me, t });
    rain(16, ['💩', '🧻', '🚽']); sfx.plop(); navigator.vibrate?.(60);
    sendPush(them, '💩 Cacómetro', `${pname(me)} se acaba de echar una`, '/', 'caca');
    const n = hoy(me) + 1;
    toast(n === 1 ? '💩 Primera del día. ¡Bien ahí!' : `💩 Van ${n} hoy. ${n >= 4 ? '¿Estás bien? 😳' : '¡Sigue así!'}`);
    setTimeout(() => $('#cadd')?.classList.add('go'), 0);
  };
  $$('[data-ck]', el).forEach(btn => btn.onclick = () => { store.update(`cartas/cacas/${mine.id}`, { k: btn.dataset.ck }); sfx.pop(); });
  $('#cundo', el)?.addEventListener('click', () => {
    const sh = sheet(`<h3>↩️ ¿Quitar tu última caca?</h3><p>La de ${esc(hace(mine.t))}. Se borra para los dos.</p><div class="row"><button class="btn" id="cyes">Sí, quitarla</button><button class="btn ghost" data-close>Cancelar</button></div>`);
    $('#cyes', sh).onclick = () => { store.set(`cartas/cacas/${mine.id}`, null); sh.remove(); toast('Quitada. Aquí no pasó nada 🤫'); };
  });
}

const b64u = s => { const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function swReg() { if (!('serviceWorker' in navigator)) return null; try { return await navigator.serviceWorker.register('sw.js'); } catch { return null; } }

/* ---------- Fotos (álbum y tablero de la boda) ----------
   Se comprimen en el teléfono y se guardan en la misma base de datos. */
async function compressImg(file, max = 1100) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * s); cv.height = Math.round(img.naturalHeight * s);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    let d = cv.toDataURL('image/jpeg', .72); if (d.length > 420000) d = cv.toDataURL('image/jpeg', .5);
    return d;
  } finally { URL.revokeObjectURL(url); }
}

function bodaCount() {
  if (!boda?.fecha) return null;
  const d = daysTo(boda.fecha), t = today0(), f = ymd(boda.fecha);
  let m = (f.getFullYear() - t.getFullYear()) * 12 + f.getMonth() - t.getMonth(); if (f.getDate() < t.getDate()) m--;
  const rest = Math.round((f - new Date(t.getFullYear(), t.getMonth() + Math.max(0, m), t.getDate())) / dayMs);
  return { d, m: Math.max(0, m), rest, sem: Math.floor(d / 7) };
}

   JUEGOS NUEVOS: Tres en raya, Conecta 4, Memoria, Ahorcado
   Todos por turnos en cartas/j/<juego>, con marcador por rondas.
   ===================================================================== */
const JUEGOS = {
  tres: { name: 'Tres en raya', icon: '⭕', desc: 'Tres en línea gana', c1: '#ff4fa3', c2: '#9d6bff' },
  c4: { name: 'Conecta 4', icon: '🟡', desc: 'Cuatro seguidas gana', c1: '#3a7ce0', c2: '#25c2a0' },
  memoria: { name: 'Memoria', icon: '🧠', desc: 'Encuentra las parejas', c1: '#ff7a2d', c2: '#ffb020' },
  ahorcado: { name: 'Ahorcado', icon: '🎈', desc: 'Adivina mi palabra', c1: '#9d6bff', c2: '#3a7ce0' },
};
Object.assign(GNAME, Object.fromEntries(Object.entries(JUEGOS).map(([k, v]) => [k, v.name])));
const GICON = { uno: '🔴', cuarenta: '🃏', tres: '⭕', c4: '🟡', memoria: '🧠', ahorcado: '🎈' };
const jgames = {};
const zero = () => ({ [P[0]]: 0, [P[1]]: 0 });
const turnTxt = st => st.turn === me ? '¡Te toca! 🐾' : `Turno de ${esc(pname(them))}...`;
function gHead(st, extra = () => '') {
  return `<div class="ghead">${P.map(p => `<div class="gp ${st && !st.winner && st.turn === p ? 'on' : ''}" style="--c:${pcol(p)}"><div><b>${esc(pname(p))}</b>${extra(p) ? `<small>${extra(p)}</small>` : ''}</div><span>${st?.score?.[p] || 0}</span></div>`).join('<em>vs</em>')}</div>`;
}
const winBox = (st, msg = '') => !st.winner ? '' : `<div class="gwin">${st.winner === 'empate' ? '🤝 ¡Empate!' : st.winner === me ? '🎉 ¡Ganaste!' : `💜 Ganó ${esc(pname(st.winner))}`}${msg ? `<p>${msg}</p>` : ''}<button class="btn" data-next>Otra ronda</button></div>`;
function mountTurnGame(g, { init, draw, rules }) {
  renderTop(GNAME[g], `<button class="ib" id="menu" aria-label="Reglas">?</button>`);
  view.innerHTML = `<div id="g"></div><div class="narr" id="gn"></div>${reactBar()}`;
  const path = 'cartas/j/' + g, el = $('#g');

  const act = fn => store.tx(path, cur => cur ? (fn(clone(cur)) ?? undefined) : undefined).then(r => {
    if (r.committed && r.value?.winner && r.value.winner !== 'empate') recordWin(g, r.value);

  });

  const render = () => {
    if (!st) return;
    draw(el, st, act);
    $('[data-next]', el)?.addEventListener('click', next);
    narrate($('#gn'), st.winner ? (st.winner === me ? '¡Ganaste! Gia está orgullosa 🐾' : st.winner === 'empate' ? 'Empate. Nadie le gana a nadie 💜' : `Ganó ${esc(pname(st.winner))}. La próxima es tuya 🐾`) : turnTxt(st), st.winner === me);
  };
  const unsub = store.on(path, v => {
    if (!v) { store.tx(path, c => c ? undefined : init(null)); return; }
    st = v;
    if (!st.winner && st.turn === me && prevTurn !== null && prevTurn !== me) { sfx.turn(); navigator.vibrate?.(60); }
    if (st.winner && winShown !== st.n && !first) {

/* ---------- Tres en raya ---------- */
const T3 = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
function mountTres() {
  const init = prev => { const first = prev ? other(prev.first) : pick(P); return { b: '.........', first, turn: first, n: (prev?.n || 0) + 1, winner: '', line: '', last: -1, score: prev?.score || zero() }; };
  const sym = (st, p) => p === st.first ? '✕' : '◯';
  mountTurnGame('tres', {
    init,
    rules: '<ul><li>Empieza quien tiene la ✕. En cada ronda empieza el otro.</li><li>Gana quien hace tres en línea: horizontal, vertical o diagonal.</li></ul>',
    draw(el, st, act) {
      const line = String(st.line || '').split(',').filter(Boolean).map(Number), owner = c => c === 'x' ? st.first : other(st.first);
      el.innerHTML = gHead(st, p => `juega con ${sym(st, p)}`) + `<div class="t3">${[...st.b].map((c, i) => `<button data-i="${i}" class="${line.includes(i) ? 'w' : ''} ${i === st.last ? 'new' : ''}" style="--c:${c === '.' ? 'var(--line)' : pcol(owner(c))};color:var(--c)">${c === '.' ? '' : c === 'x' ? '✕' : '◯'}</button>`).join('')}</div>` + winBox(st);
      $$('[data-i]', el).forEach(b => b.onclick = () => {
        const i = +b.dataset.i;
        if (st.turn !== me || st.winner) return toast(st.winner ? 'Toca "Otra ronda"' : `Espera, le toca a ${pname(them)}`);
        act(cur => {
          if (cur.winner || cur.turn !== me || cur.b[i] !== '.') return;
          const s = me === cur.first ? 'x' : 'o';
          cur.b = cur.b.slice(0, i) + s + cur.b.slice(i + 1); cur.last = i;
          const L = T3.find(l => l.every(k => cur.b[k] === s));
          if (L) { cur.winner = me; cur.line = L.join(','); cur.score = cur.score || zero(); cur.score[me] = (cur.score[me] || 0) + 1; }
          else if (!cur.b.includes('.')) cur.winner = 'empate';
          else cur.turn = other(me);
          return cur;
        }).then(() => sfx.card());
      });
    },
  });
}

/* ---------- Conecta 4 ---------- */
const c4Win = (b, i, ch) => {
  const r0 = Math.floor(i / 7), c0 = i % 7;
  for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
    const cells = [i];
    for (const s of [1, -1]) { let r = r0 + dr * s, c = c0 + dc * s; while (r >= 0 && r < 6 && c >= 0 && c < 7 && b[r * 7 + c] === ch) { cells.push(r * 7 + c); r += dr * s; c += dc * s; } }
    if (cells.length >= 4) return cells;
  }
  return null;
};
function mountC4() {
  const init = prev => { const first = prev ? other(prev.first) : pick(P); return { b: '.'.repeat(42), first, turn: first, n: (prev?.n || 0) + 1, winner: '', line: '', last: -1, score: prev?.score || zero() }; };
  const chOf = p => p === P[0] ? 'a' : 'b', pOf = ch => ch === 'a' ? P[0] : P[1];
  mountTurnGame('c4', {
    init,
    rules: '<ul><li>Toca una columna para dejar caer tu ficha.</li><li>Gana quien junta cuatro seguidas: horizontal, vertical o en diagonal.</li><li>En cada ronda empieza el otro.</li></ul>',
    draw(el, st, act) {
      const line = String(st.line || '').split(',').filter(Boolean).map(Number);
      el.innerHTML = gHead(st, p => `<i class="dot" style="background:${pcol(p)}"></i> fichas`) + `<div class="c4">${[...st.b].map((c, i) => `<i data-c="${i % 7}" class="${c !== '.' ? 'p' : ''} ${line.includes(i) ? 'w' : ''} ${i === st.last ? 'new' : ''}" style="${c !== '.' ? `--c:${pcol(pOf(c))};` : ''}--r:${Math.floor(i / 7) + 1}"></i>`).join('')}</div>` + winBox(st);
      $$('[data-c]', el).forEach(b => b.onclick = () => {
        const col = +b.dataset.c;
        if (st.turn !== me || st.winner) return toast(st.winner ? 'Toca "Otra ronda"' : `Espera, le toca a ${pname(them)}`);
        act(cur => {
          if (cur.winner || cur.turn !== me) return;
          let i = -1; for (let r = 5; r >= 0; r--) if (cur.b[r * 7 + col] === '.') { i = r * 7 + col; break; }
          if (i < 0) return;
          const ch = chOf(me); cur.b = cur.b.slice(0, i) + ch + cur.b.slice(i + 1); cur.last = i;
          const L = c4Win(cur.b, i, ch);
          if (L) { cur.winner = me; cur.line = L.join(','); cur.score = cur.score || zero(); cur.score[me] = (cur.score[me] || 0) + 1; }
          else if (!cur.b.includes('.')) cur.winner = 'empate';
          else cur.turn = other(me);
          return cur;
        }).then(r => { if (r.committed) sfx.card(); else toast('Esa columna está llena'); });
      });
    },
  });
}

/* ---------- Memoria ---------- */
const MEM_EMO = ['💗', '🌹', '🐶', '💍', '✈️', '🍫', '🌙', '🎵', '🍓', '🧸', '🌻', '💌', '🦋', '🍕', '☕', '🌈', '🎂', '⭐'];
function mountMemoria() {
  const init = prev => {
    const first = prev ? other(prev.first) : pick(P);
    const ids = R.shuffle([...MEM_EMO.keys()]).slice(0, 8), cards = R.shuffle([...ids, ...ids]);
    return { c: cards.join(','), f: '.'.repeat(16), o: '', m: '', mt: 0, first, turn: first, n: (prev?.n || 0) + 1, winner: '', score: prev?.score || zero() };
  };
  const pairs = (st, p) => [...st.f].filter(x => x === (p === P[0] ? 'a' : 'b')).length / 2;
  let builtN = null;
  const M = { st: null, t: 0 };
  mountTurnGame('memoria', {
    init,
    rules: '<ul><li>Voltea dos cartas. Si son iguales, son tuyas y vuelves a jugar.</li><li>Si no, se dan la vuelta y le toca al otro. ¡Fíjate bien en las que voltea!</li><li>Gana quien encuentre más parejas.</li></ul>',
    draw: function drawM(el, st, act) {
      M.st = st;
      const c = String(st.c).split(','), open = String(st.o || '').split(',').filter(Boolean).map(Number), miss = String(st.m || '').split(',').filter(Boolean).map(Number);
      const showMiss = miss.length && store.now() - (st.mt || 0) < 1700;
      if (builtN !== st.n || !$('.mem', el)) {
        builtN = st.n;
        el.innerHTML = `<div id="mh"></div><div class="mem">${c.map((x, i) => `<button class="mc" data-i="${i}"><div><span class="bk">🐾</span><span class="f">${MEM_EMO[+x]}</span></div></button>`).join('')}</div><div id="mw"></div>`;
        $$('[data-i]', el).forEach(b => b.onclick = () => {
          const i = +b.dataset.i, cur0 = M.st;
          if (!cur0 || cur0.turn !== me || cur0.winner) return toast(cur0?.winner ? 'Toca "Otra ronda"' : `Espera, le toca a ${pname(them)}`);
          act(cur => {
            if (cur.winner || cur.turn !== me) return;
            const o = String(cur.o || '').split(',').filter(Boolean).map(Number);
            if (cur.f[i] !== '.' || o.includes(i)) return;
            const cc = String(cur.c).split(',');
            cur.m = '';
            if (!o.length) { cur.o = String(i); return cur; }
            const j = o[0]; cur.o = '';
            if (cc[i] === cc[j]) {
              const ch = me === P[0] ? 'a' : 'b', nf = [...cur.f]; nf[i] = nf[j] = ch; cur.f = nf.join('');
              if (!cur.f.includes('.')) {
                const na = [...cur.f].filter(x => x === 'a').length, nb = 16 - na;
                cur.winner = na === nb ? 'empate' : na > nb ? P[0] : P[1];
                if (cur.winner !== 'empate') { cur.score = cur.score || zero(); cur.score[cur.winner] = (cur.score[cur.winner] || 0) + 1; }
              }
            } else { cur.m = `${j},${i}`; cur.mt = store.now(); cur.turn = other(me); }
            return cur;
          }).then(r => { if (r.committed) { sfx.card(); const v = r.value; if (v && !v.o && !v.m && !v.winner) sfx.pop(); } });
        });
      }
      $('#mh', el).innerHTML = gHead(st, p => `${pairs(st, p)} ${pairs(st, p) === 1 ? 'pareja' : 'parejas'}`);
      $$('.mc', el).forEach((b, i) => {
        const got = st.f[i] !== '.';
        b.classList.toggle('up', got || open.includes(i) || (showMiss && miss.includes(i)));
        b.classList.toggle('got', got); b.style.setProperty('--c', got ? pcol(st.f[i] === 'a' ? P[0] : P[1]) : 'transparent');
      });
      $('#mw', el).innerHTML = winBox(st, st.winner ? `${esc(pname(P[0]))} ${pairs(st, P[0])} · ${esc(pname(P[1]))} ${pairs(st, P[1])}` : '');
      clearTimeout(M.t); if (showMiss) M.t = setTimeout(() => { if (el.isConnected && M.st === st) drawM(el, st, act); }, 1750);
    },
  });
}

/* ---------- Ahorcado (con globos para Gia) ---------- */
const AH_ABC = [...'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'];
const ahN = ch => ch === 'Ñ' ? 'Ñ' : ch.normalize('NFD').replace(/[̀-ͯ]/g, '');
const ahLetters = w => [...String(w).toUpperCase()].map(ahN).filter(ch => AH_ABC.includes(ch));
function mountAhorcado() {
  const init = prev => { const setter = prev ? other(prev.setter) : pick(P); return { setter, turn: setter, word: '', pista: '', g: '', fails: 0, n: (prev?.n || 0) + 1, winner: '', score: prev?.score || zero() }; };
  mountTurnGame('ahorcado', {
    init,
    rules: '<ul><li>Uno escribe una palabra o frase secreta (puede ser algo nuestro) y una pista.</li><li>El otro adivina letra por letra. Cada letra que no está revienta un globo de Gia 🎈.</li><li>Si revientan los 6 globos, gana quien puso la palabra. En cada ronda se cambian los papeles.</li></ul>',
    draw(el, st, act) {
      const guesser = other(st.setter), g = String(st.g || ''), fails = st.fails || 0;
      const balloons = `<div class="ah-b">${Array.from({ length: 6 }, (_, i) => `<span class="${i < fails ? 'bang' : ''}" style="animation-delay:${i * .3}s">${i < fails ? '💥' : '🎈'}</span>`).join('')}</div><img class="ah-g ${st.winner && st.winner === st.setter ? 'fall' : ''}" src="img/gia.jpg" alt="Gia">`;
      if (!st.word) {
        el.innerHTML = gHead(st, p => p === st.setter ? 'pone la palabra' : 'adivina') + balloons + (st.setter === me
          ? `<div class="card" style="margin-top:14px"><h3>🤫 Escribe tu palabra secreta</h3><p class="muted" style="font-size:13px;margin:0 0 8px">${esc(pname(them))} la va a adivinar letra por letra. Puede ser una frase corta.</p>
             <input class="inp" type="text" id="ahw" maxlength="24" autocomplete="off" placeholder="Por ejemplo: Gia comelona"><input class="inp" type="text" id="ahp" maxlength="60" placeholder="Pista (opcional)" style="margin-top:8px">
             <div class="row"><button class="btn" id="ahok">Listo</button></div></div>`
          : `<p class="qwait" style="margin-top:18px">🤔 ${esc(pname(them))} está pensando una palabra secreta...</p>`);
        $('#ahok', el)?.addEventListener('click', () => {
          const w = $('#ahw', el).value.trim().replace(/\s+/g, ' '), pista = $('#ahp', el).value.trim();
          if (ahLetters(w).length < 2 || !/^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]+$/.test(w)) return toast('Solo letras y espacios, mínimo 2 letras');
          act(cur => { if (cur.word || cur.setter !== me) return; cur.word = w.toUpperCase(); cur.pista = pista; cur.turn = other(me); return cur; }).then(() => { sfx.pop(); sendPush(them, '🎈 Ahorcado', `${pname(me)} ya puso su palabra. ¡Adivina!`, '/#/ahorcado', 'ahorcado'); });
        });
        return;
      }
      const reveal = !!st.winner;
      const word = [...st.word].map(ch => {
        const L = ahN(ch);
        if (!AH_ABC.includes(L)) return '<span class="sp"></span>';
        const ok = g.includes(L);
        return `<span class="${!ok && reveal ? 'miss' : ''}">${ok || reveal ? esc(ch) : ''}</span>`;
      }).join('');
      const letters = new Set(ahLetters(st.word));
      el.innerHTML = gHead(st, p => p === st.setter ? 'puso la palabra' : 'adivina') + balloons
        + (st.pista ? `<p class="ah-p">💡 Pista: ${esc(st.pista)}</p>` : '')
        + `<div class="ah-w">${word}</div>`
        + (st.winner ? winBox(st, st.winner === guesser ? `${esc(pname(guesser))} la adivinó con ${6 - fails} ${6 - fails === 1 ? 'globo' : 'globos'} vivos` : `Era: <b>${esc(st.word)}</b>`)
          : guesser === me ? `<div class="ah-k">${AH_ABC.map(L => `<button data-l="${L}" class="${g.includes(L) ? (letters.has(L) ? 'ok' : 'no') : ''}" ${g.includes(L) ? 'disabled' : ''}>${L}</button>`).join('')}</div>`
          : `<p class="qwait">👀 ${esc(pname(them))} está adivinando tu palabra: <b>${esc(st.word)}</b></p>`);
      $$('[data-l]', el).forEach(b => b.onclick = () => {
        const L = b.dataset.l;
        act(cur => {
          if (cur.winner || !cur.word || cur.setter === me || String(cur.g || '').includes(L)) return;
          cur.g = String(cur.g || '') + L;
          const set = new Set(ahLetters(cur.word));
          if (!set.has(L)) cur.fails = (cur.fails || 0) + 1;
          if ([...set].every(x => cur.g.includes(x))) cur.winner = me;
          else if (cur.fails >= 6) cur.winner = cur.setter;
          if (cur.winner) { cur.score = cur.score || zero(); cur.score[cur.winner] = (cur.score[cur.winner] || 0) + 1; }
          return cur;
        }).then(r => { if (r.committed) { new Set(ahLetters(r.value.word)).has(L) ? sfx.pop() : sfx.sad(); } });
      });
    },
  });
}

/* =====================================================================
   PREGUNTAS (banco de preguntas.js)
   ===================================================================== */
const QCAT = id => Q.CATEGORIAS.find(c => c.id === id);
const QTIPO = id => QCAT(id)?.tipo || 'abierta';
function qText(cat, i, subj) {
  const q = Q.PREGUNTAS[cat]?.[i]; if (q == null) return '';
  const t = QTIPO(cat);
  return t === 'prefieres' ? '¿Qué prefieres?' : t === 'conoces' ? q[0] : q;
}
const qRand = (cat, not) => { const n = Q.PREGUNTAS[cat]?.length || 1; let i; do { i = Math.floor(Math.random() * n); } while (n > 1 && i === not); return i; };
function qAnsLabel(cat, i, v) {
  const t = QTIPO(cat), q = Q.PREGUNTAS[cat]?.[i];
  if (v == null) return '';
  if (t === 'prefieres') return q?.[v] ?? '';
  if (t === 'quien') return pname(v);
  if (t === 'conoces') return q?.[1]?.[v] ?? '';
  return v;
}
function mountPreguntas() {
  renderTop('Preguntas', `<button class="ib" id="qh" aria-label="Lo que hemos respondido">📚</button>`);
  view.innerHTML = `<div id="q"></div>${reactBar()}`;
  const el = $('#q');
  let st = null, prevThem = null;
  const pickCat = cat => store.set('cartas/preg', { cat, q: qRand(cat, -1), n: (st?.n || 0) + 1, pts: st?.pts || zero(), t: store.now(), by: me }).then(() => sfx.pop());
  const nextQ = () => store.set('cartas/preg', { cat: st.cat, q: qRand(st.cat, st.q), n: (st.n || 0) + 1, pts: st.pts || zero(), t: store.now(), by: me });
  const answer = v => store.tx('cartas/preg', cur => {
    if (!cur || cur.n !== st.n || cur.ans?.[me] != null) return;
    cur.ans = { ...(cur.ans || {}), [me]: v };
    if (P.every(p => cur.ans[p] != null)) {
      cur.done = store.now();
      if (QTIPO(cur.cat) === 'conoces') { const subj = P[cur.n % 2], gs = other(subj); if (+cur.ans[gs] === +cur.ans[subj]) { cur.pts = cur.pts || zero(); cur.pts[gs] = (cur.pts[gs] || 0) + 1; } }
    }
    return cur;
  }).then(r => {
    if (!r.committed) return;
    sfx.pop();
    const v2 = r.value;
    if (v2?.done) store.set(`cartas/preghist/${v2.n}_${v2.cat}`, { cat: v2.cat, q: v2.q, n: v2.n, ans: v2.ans, t: v2.done });
    else sendPush(them, '💬 Preguntas', `${pname(me)} ya respondió. Te toca 👀`, '/#/preguntas', 'preg');
  });
  const draw = () => keepDraft(el, () => {
    if (!st?.cat || !QCAT(st.cat)) {
      el.innerHTML = `<p class="muted" style="text-align:center;margin:4px 0 12px">Elijan un tipo de pregunta. Los dos ven la misma y las respuestas se descubren cuando responden los dos.</p>
        <div class="mgrid">${Q.CATEGORIAS.map(c => `<button class="mtile" data-cat="${c.id}" style="--c1:${c.c1};--c2:${c.c2}"><span class="ic">${c.icon}</span><b>${esc(c.name)}</b><small>${esc(c.desc)}</small></button>`).join('')}</div>`;
      $$('[data-cat]', el).forEach(b => b.onclick = () => pickCat(b.dataset.cat));
      return;
    }
    const c = QCAT(st.cat), t = c.tipo, q = Q.PREGUNTAS[st.cat][st.q], ans = st.ans || {}, mine = ans[me], theirs = ans[them], both = mine != null && theirs != null;
    const subj = P[(st.n || 0) % 2];
    let body = '';
    const opts = (list, vals) => `<div class="qopts">${list.map((txt, k) => `<button data-v="${vals ? vals[k] : k}" class="${mine != null && String(mine) === String(vals ? vals[k] : k) ? 'on' : ''}" ${mine != null ? 'disabled' : ''}>${esc(txt)}</button>`).join('')}</div>`;
    if (!both) {
      if (mine == null) {
        if (t === 'abierta') body = `<textarea class="inp" id="qa" rows="3" maxlength="300" placeholder="Tu respuesta"></textarea><div class="row"><button class="btn" id="qok">Responder</button></div>`;
        else if (t === 'prefieres') body = opts(q);
        else if (t === 'quien') body = opts(P.map(pname), P);
        else body = `<p class="qwait" style="margin:0 0 4px">${subj === me ? '🙋 Responde sobre ti' : `🧠 Adivina qué va a responder ${esc(pname(them))}`}</p>` + opts(q[1]);
        if (theirs != null) body += `<p class="qwait">👀 ${esc(pname(them))} ya respondió. Responde para ver qué dijo.</p>`;
      } else body = `<div class="qans"><div style="--c:${pcol(me)}"><b>Tú</b>${esc(qAnsLabel(st.cat, st.q, mine))}</div></div><p class="qwait">Esperando a ${esc(pname(them))}... 🐾</p>`;
    } else {
      body = `<div class="qans">${P.map(p => `<div style="--c:${pcol(p)}"><b>${esc(pname(p))}${t === 'conoces' ? (p === subj ? ' (sobre sí)' : ' (adivinando)') : t === 'quien' ? ' señaló a' : ''}</b>${esc(qAnsLabel(st.cat, st.q, ans[p]))}</div>`).join('')}</div>`;
      if (t === 'prefieres' || t === 'quien') body += `<div class="qmatch">${String(ans[P[0]]) === String(ans[P[1]]) ? '💗 ¡Coincidimos!' : '😅 No coincidimos'}</div>`;
      if (t === 'conoces') body += `<div class="qmatch">${+ans[subj] === +ans[other(subj)] ? `🎯 ¡${esc(pname(other(subj)))} acertó!` : `❌ ${esc(pname(other(subj)))} falló`}</div><p class="qwait">Aciertos: ${P.map(p => `${esc(pname(p))} ${st.pts?.[p] || 0}`).join(' · ')}</p>`;
    }
    el.innerHTML = `<div class="qcard" style="--c1:${c.c1};--c2:${c.c2}"><div class="qc">${c.icon} ${esc(c.name)}</div>
      <h2>${t === 'conoces' ? `<small style="display:block;font:800 13px var(--fb);opacity:.8;margin-bottom:4px">Sobre ${esc(subj === me ? 'ti' : pname(subj))}</small>` : ''}${esc(t === 'prefieres' ? `${q[0]} o ${q[1].charAt(0).toLowerCase() + q[1].slice(1)}?`.replace(/^/, '¿') : qText(st.cat, st.q))}</h2></div>
      ${body}
      <div class="row"><button class="btn ${both ? '' : 'ghost'}" id="qnext">${both ? 'Siguiente pregunta ›' : 'Saltar'}</button><button class="btn ghost" id="qcat">Cambiar tipo</button></div>`;
    $('#qok', el)?.addEventListener('click', () => { const v = $('#qa', el).value.trim(); if (v) answer(v); else toast('Escribe tu respuesta'); });
    $$('[data-v]', el).forEach(b => b.onclick = () => answer(t === 'quien' ? b.dataset.v : +b.dataset.v));
    $('#qnext', el).onclick = nextQ;
    $('#qcat', el).onclick = () => store.set('cartas/preg/cat', null);
  });
  const unsub = store.on('cartas/preg', v => {
    const th = v?.ans?.[them];
    if (st && v && v.n === st.n && th != null && prevThem == null) { sfx.pop(); navigator.vibrate?.(40); }
    prevThem = v && st && v.n === st.n ? th : (v?.ans?.[them] ?? null);
    st = v; draw();
  });
  $('#qh').onclick = () => {
    const sh = sheet(`<h3>📚 Lo que hemos respondido</h3><div id="qhl"><p class="muted">Cargando...</p></div><div class="row"><button class="btn ghost" data-close>Cerrar</button></div>`);
    const u = store.on('cartas/preghist', v => {
      const list = listOf(v).filter(x => QCAT(x.cat)).sort((a, b) => b.t - a.t).slice(0, 60);
      $('#qhl', sh).innerHTML = list.length ? list.map(x => { const c = QCAT(x.cat); const qq = Q.PREGUNTAS[x.cat][x.q]; return `<div class="card" style="margin:8px 0"><div style="font-size:12px;color:var(--muted)">${c.icon} ${esc(c.name)} · ${fdate(x.t)}</div><b style="display:block;margin:4px 0 6px">${esc(c.tipo === 'prefieres' ? `${qq[0]} o ${qq[1]}` : qText(x.cat, x.q))}</b><div class="qans">${P.map(p => `<div style="--c:${pcol(p)}"><b>${esc(pname(p))}</b>${esc(qAnsLabel(x.cat, x.q, x.ans?.[p]))}</div>`).join('')}</div></div>`; }).join('') : '<p class="muted">Todavía no hay respuestas guardadas.</p>';
      setTimeout(u, 0);
    });
  };
  current = { id: 'preguntas', cleanup() { unsub(); } };
}

/* ---------- Pregunta del día (en el inicio) ---------- */
const ABIERTAS = Q.CATEGORIAS.filter(c => c.tipo === 'abierta').flatMap(c => Q.PREGUNTAS[c.id].map((_, i) => [c.id, i]));
function diariaDe(key) { let h = 0; for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) >>> 0; const [cat, i] = ABIERTAS[h % ABIERTAS.length]; return { cat, i, text: Q.PREGUNTAS[cat][i] }; }
function diariaCard(el, key, data) {
  if (!el) return;
  const q = diariaDe(key), mine = data?.[me], theirs = data?.[them];
  keepDraft(el, () => {
    el.innerHTML = `<div class="dqh"><span>☀️ Pregunta del día</span><button class="link" id="dqold">días anteriores</button></div><h3>${esc(q.text)}</h3>
      ${mine ? `<div class="qans"><div style="--c:${pcol(me)}"><b>Tú</b>${esc(mine.text)}</div>${theirs ? `<div style="--c:${pcol(them)}"><b>${esc(pname(them))}</b>${esc(theirs.text)}</div>` : ''}</div>${theirs ? '' : `<p class="qwait" style="margin:6px 0 0">${esc(pname(them))} todavía no responde</p>`}`
        : `<textarea class="inp" id="dqa" rows="2" maxlength="300" placeholder="Tu respuesta"></textarea><div class="row" style="margin-bottom:0"><button class="btn sm" id="dqok">Responder</button></div>${theirs ? `<p class="qwait" style="margin:6px 0 0">👀 ${esc(pname(them))} ya respondió. Responde para ver qué dijo.</p>` : ''}`}`;

    store.set(`cartas/diaria/${key}/${me}`, { text: v, t: store.now() }); sfx.pop();
    sendPush(them, '☀️ Pregunta del día', theirs ? `${pname(me)} respondió. Ya pueden ver lo que dijo cada uno` : `${pname(me)} ya respondió. ¿Y tú?`, '/', 'diaria');
  });
  $('#dqold', el).onclick = () => {
    const sh = sheet(`<h3>☀️ Días anteriores</h3><div id="dql"><p class="muted">Cargando...</p></div><div class="row"><button class="btn ghost" data-close>Cerrar</button></div>`);
    const u = store.on('cartas/diaria', v => {
      const days = Object.keys(v || {}).filter(k => k < key).sort().reverse().slice(0, 30);
      $('#dql', sh).innerHTML = days.length ? days.map(k => { const d = v[k] || {}, [y, m, dd] = k.split('-').map(Number); return `<div class="card" style="margin:8px 0"><div style="font-size:12px;color:var(--muted)">${fdate(new Date(y, m - 1, dd), { weekday: 'long', day: 'numeric', month: 'short' })}</div><b style="display:block;margin:4px 0 6px">${esc(diariaDe(k).text)}</b><div class="qans">${P.map(p => `<div style="--c:${pcol(p)}"><b>${esc(pname(p))}</b>${d[p] ? (d[me] ? esc(d[p].text) : p === me ? '' : '🙈 (no respondiste ese día)') : '<span class="muted">No respondió</span>'}</div>`).join('')}</div></div>`; }).join('') : '<p class="muted">Todavía no hay días anteriores.</p>';
      setTimeout(u, 0);
    });
  };
}

    confirmSheet(`💌 Ábrela cuando ${esc(c.cuando)}`, '¿De verdad es el momento? Solo se abre una vez... bueno, después la puedes volver a leer 😉', 'Abrir', () => {
      store.set(`cartas/cartas/${id}/abierta`, store.now()); rain(18, ['💌', '💗', '✨']); sfx.win(); show();
      sendPush(them, '💌 Cartas', `${pname(me)} abrió tu carta «Ábrela cuando ${c.cuando}»`, '/#/cartas', 'carta-abierta');

      <input type="text" id="cw" maxlength="60" placeholder="O escribe otro momento: ...cuando ">
      <h4>Tu carta</h4><textarea id="ct" rows="6" maxlength="2000" placeholder="Escribe con el corazón"></textarea>

    $$('[data-w]', sh).forEach(b => b.onclick = () => { cuando = b.dataset.w; $('#cw', sh).value = ''; $$('[data-w]', sh).forEach(x => x.classList.toggle('on', x === b)); });
