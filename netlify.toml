[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Los archivos están todos sueltos: estas reglas hacen que icons/... e img/... los encuentren
[[redirects]]
  from = "/icons/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/img/*"
  to = "/:splat"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"
